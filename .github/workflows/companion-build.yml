name: Companion Release Build

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            ext: ''
          - os: macos-13
            target: x86_64-apple-darwin
            ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: '.exe'
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion/server

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin companion
        working-directory: companion/server

      - name: Rename binary
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/companion${{ matrix.ext }}" "target/${{ matrix.target }}/release/file-viewer-companion-${{ matrix.target }}${{ matrix.ext }}"
        working-directory: companion/server

      - name: Compute SHA-256
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          shasum -a 256 "file-viewer-companion-${{ matrix.target }}${{ matrix.ext }}" > "file-viewer-companion-${{ matrix.target }}${{ matrix.ext }}.sha256"
        working-directory: companion/server

      - uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.target }}
          path: |
            companion/server/target/${{ matrix.target }}/release/file-viewer-companion-${{ matrix.target }}${{ matrix.ext }}
            companion/server/target/${{ matrix.target }}/release/file-viewer-companion-${{ matrix.target }}${{ matrix.ext }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release checksums
        run: cat artifacts/*.sha256 > artifacts/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/file-viewer-companion-*
            artifacts/SHA256SUMS.txt
