[package]
name = "file-viewer-companion"
version = "0.1.0"
edition = "2021"
description = "Local companion server for file-viewer — enables save-back to disk"

[[bin]]
name = "companion"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
axum-test = "14"
tokio-test = "0.4"
tempfile = "3"
urlencoding = "2"
tower = { version = "0.4", features = ["util"] }
