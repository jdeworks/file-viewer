<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>File Viewer</title>
  <meta name="description" content="Mobile-first, private, client-only file viewer. Nothing leaves your device.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <meta name="theme-color" content="#2f6feb">
  <!-- iOS standalone support — ONLY used by the opt-in "Add to Home Screen" hint we surface for
       iPhone users when an audio file is open (background/lock-screen playback). The manifest
       stays browser-mode so Android/desktop do not get a default app install prompt. -->
  <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="File Viewer">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="assets/app.css">
  <link rel="stylesheet" href="assets/companion.css">
  <link rel="stylesheet" href="assets/examples.css">
<link rel="stylesheet" href="assets/preview-chrome.css">
</head>
<body>
  <div id="app">
    <!-- Top bar: minimal by default, expert controls tuck behind the gear / fullscreen. -->
    <header class="topbar">
      <button class="icon-btn" id="treeBtn" title="Toggle file tree" aria-label="Toggle file tree" hidden>☰</button>
      <div class="brand" title="File Viewer — nothing leaves your device">◧ Viewer</div>

      <div class="file-id" id="fileId" hidden>
        <span class="file-name" id="fileName">—</span>
        <span class="companion-linked" id="companionLinked" hidden></span>
        <select class="type-select" id="typeSelect" title="Detected type with match confidence (each type scored independently) — override if we guessed wrong"></select>
        <span id="previewOnlyBadge" hidden>Preview only</span>
        <button class="icon-btn" id="openInlineBtn" title="Open another file or folder" aria-label="Open another file or folder">📂</button>
      </div>

      <div class="spacer"></div>

      <!-- Raw-side content switch (4-way, icons). Visible when the type is editable/diffable. -->
      <div class="seg rawmode" id="rawMode" hidden role="tablist" aria-label="Raw content mode">
        <button data-raw="original" title="Original" aria-label="Original">⟲</button>
        <button data-raw="current" class="active" title="Current" aria-label="Current">≡</button>
        <button data-raw="diff" title="Diff" aria-label="Diff">⇄</button>
        <button data-raw="movediff" title="Move-aware diff" aria-label="Move-aware diff">⇅</button>
        <button id="compareBtn" data-raw="compare" title="Compare with another file…" aria-label="Compare with another file">⧉</button>
      </div>
      <input type="file" id="compareInput" hidden aria-hidden="true">

      <!-- View-mode switch (icons). Visible only when the type supports a preview. -->
      <div class="seg viewmode" id="viewMode" hidden role="tablist" aria-label="View mode">
        <button data-mode="raw" title="Raw" aria-label="Raw">⟨⟩</button>
        <button data-mode="split" title="Split" aria-label="Split">▥</button>
        <button data-mode="preview" title="Preview" aria-label="Preview">▦</button>
      </div>

      <button class="icon-btn" id="tableModeBtn" title="Edit as table" aria-label="Edit as table" aria-pressed="false" hidden>⊞</button>
      <button type="button" class="icon-btn" id="envFormBtn" title="Edit as form" aria-label="Edit as form" aria-pressed="false" hidden>⊟ Form</button>
      <button type="button" class="icon-btn" id="iniFormBtn" title="Toggle INI form editor" aria-label="Toggle INI form editor" aria-pressed="false" hidden>⊟ Form</button>
      <button type="button" class="icon-btn" id="htmlVisualBtn" title="Switch to visual editor" aria-label="Visual editor" aria-pressed="false" hidden>Visual</button>
      <button class="icon-btn" id="formatBtn" title="Format document" aria-label="Format" hidden>{ }</button>
      <button class="icon-btn save-btn" id="saveBtn" title="Save to disk via Companion" aria-label="Save to disk" hidden>💾</button>
      <button class="icon-btn" id="downloadBtn" title="Download" aria-label="Download" hidden>⤓</button>
      <button class="icon-btn" id="themeBtn" title="Toggle dark / light" aria-label="Toggle theme">◐</button>
      <button class="icon-btn" id="screenshotBtn" title="Screenshot preview" aria-label="Screenshot" hidden>▣</button>
      <button class="icon-btn" id="sbsBtn" title="Side-by-side with another file" aria-label="Side by side" hidden>⊟</button>
      <input type="file" id="sbsInput" hidden aria-hidden="true">
      <button class="icon-btn" id="exportBtn" title="Export / Download as…" aria-label="Export" aria-expanded="false" hidden>📤</button>
      <button class="icon-btn" id="typeHelpBtn" title="Type documentation" aria-label="Type documentation" hidden>?</button>
      <button class="icon-btn" id="metaBtn" title="File info" aria-label="File info" hidden>ⓘ</button>
      <button class="icon-btn" id="gamesBtn" title="Arcade" aria-label="Open arcade" hidden>🎮</button>
      <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings" hidden>⚙</button>
      <button class="icon-btn" id="moreBtn" title="More controls" aria-label="More controls" aria-expanded="false" hidden>⋯</button>
      <button class="icon-btn" id="fullscreenBtn" title="Fullscreen" aria-label="Fullscreen">⛶</button>
      <span id="offlineBadge" hidden aria-live="polite"></span>
      <!-- On phones the overflow controls move into this popover (see app.js layoutTopbar). -->
      <div class="more-menu" id="moreMenu" hidden></div>
      <!-- Export / Download-as popover, populated on open (see app.js openExportMenu). -->
      <div class="more-menu export-menu" id="exportMenu" hidden></div>
    </header>

    <div class="body">
    <!-- Folder tree sidebar -->
    <aside id="fileTree" class="filetree" hidden aria-label="File tree">
      <div class="ft-head">
        <span class="ft-root" id="ftRoot">Folder</span>
        <button class="icon-btn ft-tree-action" id="ftExpandBtn" hidden title="Expand all folders" aria-label="Expand all folders">▾</button>
        <button class="icon-btn ft-tree-action" id="ftCollapseBtn" hidden title="Collapse all folders" aria-label="Collapse all folders">▸</button>
        <button class="icon-btn ft-export" id="ftExportBtn" hidden title="Export folder as .zip (with your edits)" aria-label="Export folder as zip">⤓</button>
        <button class="icon-btn ft-close" id="treeCloseBtn" title="Hide tree" aria-label="Hide tree">‹</button>
      </div>
      <button class="repo-badge" id="repoBtn" hidden title="View branches & commits">⎇ Branches &amp; commits</button>
      <div class="ft-search" id="ftSearch" hidden>
        <input type="search" id="ftSearchInput" placeholder="Filter files… (Enter: search contents)" aria-label="Filter files">
        <span class="ft-search-count" id="ftSearchCount"></span>
      </div>
      <div class="ft-notice" id="ftNotice" hidden></div>
      <div class="ft-body" id="ftBody"></div>
    </aside>
    <div class="ft-resize" id="ftResize" hidden role="separator" aria-orientation="vertical" aria-label="Resize sidebar" title="Drag to resize"></div>

    <div class="main-area">
    <!-- Intake screen -->
    <section id="intake" class="intake">
      <div class="dropzone" id="dropZone">
        <div class="dz-icon">⬓</div>
        <h1>Drop a file, pick one, or paste</h1>
        <p class="muted">Everything runs in your browser. No upload, no server, no tracking.</p>
        <div class="dz-actions">
          <div class="dz-buttons">
            <label class="btn primary">
              Choose file
              <input type="file" id="fileInput" hidden>
            </label>
            <label class="btn">
              Choose folder
              <input type="file" id="folderInput" webkitdirectory directory multiple hidden>
            </label>
            <button class="btn" id="newFileBtn" type="button">New file</button>
          </div>
          <span class="muted">or drag &amp; drop a file or folder · ⌘/Ctrl+V to paste</span>
        </div>
        <div class="examples" id="examples"></div>
      </div>
    </section>

    <!-- Git repository browser (branches + commits) -->
    <section id="repoPanel" class="repo-panel" hidden aria-label="Repository"></section>

    <!-- Workspace -->
    <section id="workspace" class="workspace" hidden>
      <!-- Known-file enhancement indicator + revert (Layer 3) -->
      <div class="enhance-chip" id="enhanceChip" hidden>
        <span class="ec-label"></span>
        <button class="ec-toggle" type="button"></button>
      </div>
      <!-- Mobile tab bar (hidden on desktop split) -->
      <div class="tabbar" id="tabbar">
        <button data-mode="raw" class="active">Raw</button>
        <button data-mode="preview">Preview</button>
      </div>
      <div class="panes" id="panes">
        <div class="pane raw-pane" id="rawPane">
          <div id="compareBar" class="compare-bar" hidden>
            <span class="compare-label"></span>
            <button class="compare-pick" type="button">Choose file</button>
            <button class="compare-stop" type="button">Stop comparing</button>
          </div>
          <div id="editDisclaimer" class="edit-disclaimer" hidden>
            <span class="edit-disclaimer-msg">ℹ Changes are in-memory only — <strong>download</strong> to save to your device.</span>
            <span class="edit-disclaimer-actions">
              <button class="edit-disclaimer-never" type="button">Never show again</button>
              <button class="edit-disclaimer-close" type="button" aria-label="Dismiss">✕</button>
            </span>
          </div>
          <div id="autosaveBanner" class="autosave-banner" hidden aria-live="polite">
            <span class="autosave-icon">↩</span>
            <span class="autosave-age"></span>
            <button type="button" class="autosave-restore">Restore</button>
            <button type="button" class="autosave-dismiss">Dismiss</button>
          </div>
          <div id="wordCountBar" class="word-count-bar" hidden></div>
          <div id="markdownTools" class="md-tools-bar" hidden>
            <button type="button" class="md-btn" data-md-action="bold" title="Bold (Ctrl+B)"><b>B</b></button>
            <button type="button" class="md-btn md-btn-italic" data-md-action="italic" title="Italic (Ctrl+I)"><i>I</i></button>
            <button type="button" class="md-btn" data-md-action="strikethrough" title="Strikethrough">~~</button>
            <button type="button" class="md-btn" data-md-action="heading" title="Heading">H</button>
            <span class="md-sep"></span>
            <button type="button" class="md-btn" data-md-action="bullet-list" title="Bullet list">•</button>
            <button type="button" class="md-btn" data-md-action="ordered-list" title="Numbered list">1.</button>
            <button type="button" class="md-btn" data-md-action="blockquote" title="Blockquote">"</button>
            <span class="md-sep"></span>
            <button type="button" class="md-btn" data-md-action="inline-code" title="Inline code">`</button>
            <button type="button" class="md-btn" data-md-action="code-block" title="Code block">```</button>
            <span class="md-sep"></span>
            <button type="button" class="md-btn" id="mdTableBtn" data-md-action="table" title="Insert table">⊞</button>
            <span class="md-sep"></span>
            <button type="button" class="md-btn" id="wysiwygBtn" title="Switch to visual editor (WYSIWYG)" aria-pressed="false">WYSIWYG</button>
          </div>
          <div id="jsonTools" class="md-tools-bar" hidden aria-label="JSON tools">
            <button type="button" class="md-btn" data-json-action="format" title="Format JSON (pretty-print)">Format</button>
            <button type="button" class="md-btn" data-json-action="minify" title="Minify JSON (remove whitespace)">Minify</button>
            <span class="md-sep"></span>
            <button type="button" class="md-btn" data-json-action="validate" title="Validate JSON">Validate</button>
            <span id="jsonValidIndicator" class="json-valid-indicator" hidden></span>
          </div>
          <div id="yamlTools" class="md-tools-bar" hidden aria-label="YAML tools">
            <button type="button" class="md-btn" id="yamlFormatBtn" title="Format YAML (indent: 2)">Format</button>
            <span class="md-sep"></span>
            <button type="button" class="md-btn" id="yamlValidateBtn" title="Validate YAML syntax">Validate</button>
            <span id="yamlValidIndicator" class="json-valid-indicator" hidden></span>
          </div>
          <div id="xmlTools" class="md-tools-bar" hidden aria-label="XML tools">
            <button type="button" class="md-btn" id="xmlFormatBtn" title="Format XML with indentation">Format</button>
            <span class="md-sep"></span>
            <button type="button" class="md-btn" id="xmlValidateBtn" title="Validate XML syntax">Validate</button>
            <span id="xmlValidIndicator" class="json-valid-indicator" hidden></span>
          </div>
          <div id="tomlTools" class="md-tools-bar" hidden aria-label="TOML tools">
            <button id="tomlValidateBtn" class="md-btn" title="Validate TOML syntax">Validate</button>
            <span id="tomlValidIndicator" class="json-valid-indicator" hidden></span>
          </div>
          <div id="textUtils" class="md-tools-bar text-utils-bar" hidden aria-label="Text utilities">
            <button class="md-btn" data-textutil="sortAsc" title="Sort lines A → Z">Sort ↑</button>
            <button class="md-btn" data-textutil="sortDesc" title="Sort lines Z → A">Sort ↓</button>
            <span class="md-sep"></span>
            <button class="md-btn" data-textutil="trim" title="Remove trailing whitespace from each line">Trim</button>
            <button class="md-btn" data-textutil="dedup" title="Remove duplicate lines (keeps first occurrence)">Dedup</button>
            <span class="md-sep"></span>
            <button class="md-btn" data-textutil="b64encode" title="Encode selection (or full text) as Base64">B64 ↑</button>
            <button class="md-btn" data-textutil="b64decode" title="Decode Base64 selection (or full text)">B64 ↓</button>
          </div>
          <div id="htmlToolbar" class="html-toolbar" hidden>
            <button type="button" class="ht-btn" data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
            <button type="button" class="ht-btn ht-italic" data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
            <button type="button" class="ht-btn ht-underline" data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
            <span class="ht-sep"></span>
            <button type="button" class="ht-btn" data-cmd="formatBlock" data-val="h1" title="Heading 1">H1</button>
            <button type="button" class="ht-btn" data-cmd="formatBlock" data-val="h2" title="Heading 2">H2</button>
            <button type="button" class="ht-btn" data-cmd="formatBlock" data-val="h3" title="Heading 3">H3</button>
            <span class="ht-sep"></span>
            <button type="button" class="ht-btn" data-cmd="insertUnorderedList" title="Bullet list">•</button>
            <button type="button" class="ht-btn" data-cmd="insertOrderedList" title="Numbered list">1.</button>
            <span class="ht-sep"></span>
            <button type="button" id="htmlLinkBtn" class="ht-btn" title="Insert link">&#x1F517;</button>
            <button type="button" class="ht-btn" data-cmd="unlink" title="Remove link">&#x2298;</button>
            <span class="ht-sep"></span>
            <button type="button" class="ht-btn" data-cmd="undo" title="Undo">&#x21A9;</button>
            <button type="button" class="ht-btn" data-cmd="redo" title="Redo">&#x21AA;</button>
          </div>
          <div id="editor" class="editor-host"></div>
        </div>
        <div class="split-divider" id="splitDivider" hidden role="separator" aria-orientation="vertical" aria-label="Drag to resize panes" title="Drag to resize"></div>
        <div class="pane preview-pane" id="previewPane"><div id="previewHost" class="preview-host"></div></div>
      </div>
    </section>
    </div><!-- /.main-area -->
    </div><!-- /.body -->

    <!-- Settings drawer (collapsible, off-canvas) -->
    <aside id="settingsDrawer" class="drawer" hidden aria-label="Settings">
      <div class="drawer-head"><h2>Settings</h2><button class="icon-btn" data-close>✕</button></div>
      <div class="drawer-body" id="settingsBody"></div>
    </aside>

    <!-- Metadata drawer -->
    <aside id="metaDrawer" class="drawer" hidden aria-label="File info">
      <div class="drawer-head"><h2>File info</h2><button class="icon-btn" data-close>✕</button></div>
      <div class="drawer-body" id="metaBody"></div>
    </aside>

    <!-- Type help drawer -->
    <aside id="typeHelpDrawer" class="drawer" hidden aria-label="Type documentation">
      <div class="drawer-head"><h2 id="typeHelpTitle">Type docs</h2><button class="icon-btn" data-close aria-label="Close">✕</button></div>
      <div class="drawer-body" id="typeHelpBody"></div>
    </aside>

    <div id="offlineStatus" class="offline-status" hidden></div>
    <!-- iOS-only opt-in: shown when audio is open on an iPhone/iPad (not Android/desktop). -->
    <div id="iosAudioHint" class="ios-hint" hidden></div>
    <div id="toast" class="toast" hidden></div>
    <div id="scrim" class="scrim" hidden></div>
  </div>

  <script type="module" src="core/app.js"></script>
</body>
</html>
