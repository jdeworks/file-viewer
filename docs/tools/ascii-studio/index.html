<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="ASCII Art Generator – Image and Webcam ASCII Studio">
  <meta name="twitter:description" content="Convert an image or live webcam view into configurable ASCII art locally in your browser with text and image export tools.">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "ASCII Studio",
    "url": "https://jdeworks.github.io/file-viewer/tools/ascii-studio/",
    "description": "Convert an image or live webcam view into configurable ASCII art locally in your browser with text and image export tools.",
    "applicationCategory": "MultimediaApplication",
    "operatingSystem": "Any operating system with a modern web browser",
    "isAccessibleForFree": true,
    "offers": {
      "@type": "Offer",

  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="top">
    <h1>ASCII Studio</h1>
  </header>

  <main id="image-view">
    <div id="drop" class="drop">
      <input id="file" type="file" accept="image/*" hidden>
      <p>Drop an image here, <button id="pick" type="button" class="link">choose a file</button>, or <button id="sample" type="button" class="link">use a sample</button>.</p>
    </div>
    <div id="studio" class="studio-host"></div>
  </main>

  <dialog id="sample-dialog" class="sample-dialog" aria-labelledby="sample-title">
    <div class="sample-head">
      <div>
        <h2 id="sample-title">Choose a sample image</h2>
        <p>Open any maintained browser-safe image example.</p>
      </div>
      <button id="sample-close" type="button" class="sample-close" aria-label="Close sample gallery">✕</button>
    </div>
    <div id="sample-error" class="sample-error" role="status" aria-live="polite"></div>
    <div id="sample-grid" class="sample-grid"></div>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>
