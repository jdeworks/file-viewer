msrv = "1.70.0"
cognitive-complexity-threshold = 25
type-complexity-threshold = 250
too-many-arguments-threshold = 7
too-many-lines-threshold = 100
too-large-for-stack = 512000
enum-variant-size-threshold = 200
verbose-bit-mask-threshold = 1
literal-representation-threshold = 16
trivial-copy-size-limit = 32
pass-by-value-size-limit = 256
doc-valid-idents = ["GitLab", "GitHub", "OAuth", "GraphQL", "WebAssembly", "JavaScript", "TypeScript"]
disallowed-names = ["foo", "bar", "baz", "quux"]
disallowed-types = []
disallowed-methods = []
allow-dbg-in-tests = true
allow-print-in-tests = true
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = false
