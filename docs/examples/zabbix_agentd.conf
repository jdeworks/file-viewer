# Zabbix Agent configuration file
# https://www.zabbix.com/documentation/current/en/manual/config/items/itemtypes/zabbix_agent

############ GENERAL PARAMETERS #################

### Option: PidFile
PidFile=/var/run/zabbix/zabbix_agentd.pid

### Option: LogFile
LogFile=/var/log/zabbix/zabbix_agentd.log

### Option: LogFileSize
# 0 - disable automatic log rotation
LogFileSize=10

### Option: DebugLevel
DebugLevel=3

### Option: Server
# List of comma delimited IP addresses (or hostnames) of Zabbix servers/proxies.
Server=192.168.1.100,192.168.1.101

### Option: ServerActive
# Zabbix server/proxy address or cluster configuration to get active checks from.
ServerActive=192.168.1.100:10051

### Option: Hostname
Hostname=web-frontend-01.example.com

### Option: HostMetadata
HostMetadata=Linux Apache WebServer

############ ADVANCED PARAMETERS ################

### Option: ListenPort
ListenPort=10050

### Option: ListenIP
ListenIP=0.0.0.0

### Option: StartAgents
StartAgents=3

### Option: RefreshActiveChecks
RefreshActiveChecks=120

### Option: BufferSend
BufferSend=5

### Option: BufferSize
BufferSize=200

### Option: MaxLinesPerSecond
MaxLinesPerSecond=20

### Option: Timeout
Timeout=10

### Option: AllowRoot
AllowRoot=0

### Option: User
User=zabbix

### Option: EnableRemoteCommands
# WARNING: Security sensitive setting! Keep at 0 unless required.
EnableRemoteCommands=0

### Option: LogRemoteCommands
LogRemoteCommands=1

############ SECURITY PARAMETERS ################

### Option: TLSConnect
TLSConnect=psk

### Option: TLSAccept
TLSAccept=psk

### Option: TLSPSKIdentity
TLSPSKIdentity=web-frontend-01-psk

### Option: TLSPSKFile
TLSPSKFile=/etc/zabbix/zabbix_agentd.psk

############ USER-DEFINED PARAMETERS ############

### Option: Include
Include=/etc/zabbix/zabbix_agentd.d/*.conf
Include=/etc/zabbix/zabbix_agentd.d/userparams.conf

### Option: UserParameter
UserParameter=custom.nginx.active,/usr/lib/zabbix/externalscripts/nginx_stats.sh active
UserParameter=custom.nginx.reading,/usr/lib/zabbix/externalscripts/nginx_stats.sh reading
UserParameter=custom.nginx.writing,/usr/lib/zabbix/externalscripts/nginx_stats.sh writing
UserParameter=custom.disk.usage[*],df -h $1 | awk 'NR==2{print $5}' | tr -d '%'
UserParameter=custom.app.health,curl -sf http://localhost:8080/health | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])"
