resolver: lts-21.25

packages:
  - .
  - libs/my-lib
  - apps/my-app

extra-deps:
  - async-pool-0.2.0.0
  - monoidal-containers-0.6.4.0
  - binary-orphans-1.0.4.1
  - data-clist-0.1.2.3
  - amazonka-2.0.0

system-ghc: false
install-ghc: true

ghc-options:
  "$everything": -haddock
  my-project: -Wall -Wcompat -Wincomplete-record-updates -Wincomplete-uni-patterns -Wredundant-constraints
