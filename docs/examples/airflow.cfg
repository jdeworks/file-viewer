[core]
dags_folder = /opt/airflow/dags
base_log_folder = /opt/airflow/logs
executor = CeleryExecutor
parallelism = 32
max_active_runs_per_dag = 16
load_examples = False
plugins_folder = /opt/airflow/plugins
fernet_key = changeme-use-a-real-fernet-key-here
donot_pickle = True
dagbag_import_timeout = 30

[database]
sql_alchemy_conn = postgresql+psycopg2://airflow:changeme@postgres:5432/airflow
sql_alchemy_pool_size = 5
sql_alchemy_max_overflow = 10
sql_alchemy_pool_timeout = 30

[webserver]
base_url = http://localhost:8080
web_server_host = 0.0.0.0
web_server_port = 8080
secret_key = changeme-replace-with-random-secret
workers = 4
worker_class = sync
access_logfile = -
error_logfile = -
expose_config = False
authenticate = True
auth_backend = airflow.contrib.auth.backends.password_auth

[scheduler]
job_heartbeat_sec = 5
scheduler_heartbeat_sec = 5
run_duration = -1
max_threads = 2
catchup_by_default = True
max_tis_per_query = 512
statsd_on = False
statsd_host = localhost
statsd_port = 8125

[celery]
broker_url = redis://redis:6379/0
result_backend = db+postgresql://airflow:changeme@postgres:5432/airflow
worker_concurrency = 16
worker_log_server_port = 8793

[smtp]
smtp_host = smtp.example.com
smtp_port = 587
smtp_starttls = True
smtp_ssl = False
smtp_user = airflow@example.com
smtp_password = changeme-smtp-password
smtp_mail_from = airflow@example.com

[logging]
logging_level = INFO
fab_logging_level = WARNING
log_format = [%%(asctime)s] {%%(filename)s:%%(lineno)d} %%(levelname)s - %%(message)s
simple_log_format = %%(asctime)s %%(levelname)s - %%(message)s

[metrics]
statsd_on = False
statsd_host = localhost
statsd_port = 8125
statsd_prefix = airflow
