#######################################################
#               Exim Configuration                    #
#######################################################

primary_hostname = mail.example.com

domainlist local_domains = @ : example.com : lists.example.com
domainlist relay_to_domains =
hostlist relay_from_hosts = <; 127.0.0.1 ; ::1 ; 192.168.1.0/24

acl_smtp_rcpt = acl_check_rcpt
acl_smtp_data = acl_check_data

tls_advertise_hosts = *
tls_certificate = /etc/ssl/certs/exim.pem
tls_privatekey = /etc/ssl/private/exim.key

daemon_smtp_ports = 25 : 587 : 465
tls_on_connect_ports = 465

ignore_bounce_errors_after = 2d
timeout_frozen_after = 7d

begin acl

acl_check_rcpt:
  accept hosts = :
  deny message = Restricted to authorized users only
    !hosts = ${if exists{/etc/exim4/relay_hosts} {/etc/exim4/relay_hosts} {}}
  accept domains = +local_domains
  accept domains = +relay_to_domains
  deny message = relay not permitted

acl_check_data:
  accept

begin routers

dnslookup:
  driver = dnslookup
  domains = ! +local_domains
  transport = remote_smtp
  ignore_target_hosts = 0.0.0.0 : 127.0.0.0/8
  no_more

system_aliases:
  driver = redirect
  allow_fail
  allow_defer
  data = ${lookup{$local_part}lsearch{/etc/aliases}}

local_delivery:
  driver = accept
  transport = local_delivery_transport
  headers_add = "Delivered-To: $local_part@$domain"

begin transports

remote_smtp:
  driver = smtp
  message_size_limit = 52428800
  hosts_require_tls = *

local_delivery_transport:
  driver = appendfile
  file = /var/mail/$local_part
  delivery_date_add
  envelope_to_add
  return_path_add
  mode = 0660
  mode_fail_narrower = false

begin authenticators

login:
  driver = plaintext
  public_name = LOGIN
  server_prompts = "Username:: : Password::"
  server_condition = ${if saslauthd{{$auth1}{$auth2}}{1}{0}}
  server_set_id = $auth1
