apiVersion: v1
kind: Config
preferences: {}
current-context: dev-cluster-context

clusters:
  - name: production-cluster
    cluster:
      server: https://prod.k8s.example.com:6443
      certificate-authority-data: DATA+OMITTED
  - name: staging-cluster
    cluster:
      server: https://staging.k8s.example.com:6443
      certificate-authority-data: DATA+OMITTED
  - name: dev-cluster
    cluster:
      server: https://127.0.0.1:6443
      insecure-skip-tls-verify: true

contexts:
  - name: prod-cluster-context
    context:
      cluster: production-cluster
      user: prod-admin
      namespace: default
  - name: staging-cluster-context
    context:
      cluster: staging-cluster
      user: staging-user
      namespace: staging
  - name: dev-cluster-context
    context:
      cluster: dev-cluster
      user: dev-user
      namespace: development

users:
  - name: prod-admin
    user:
      client-certificate-data: DATA+OMITTED
      client-key-data: DATA+OMITTED
  - name: staging-user
    user:
      token: DATA+OMITTED
  - name: dev-user
    user:
      client-certificate-data: DATA+OMITTED
      client-key-data: DATA+OMITTED
