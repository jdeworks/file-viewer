# dnsmasq configuration
# /etc/dnsmasq.conf

# Interface to listen on
interface=eth0
bind-interfaces

# Local domain
domain=home.lan
expand-hosts

# Upstream DNS servers (use Cloudflare and Google)
server=1.1.1.1
server=8.8.8.8

# Do not forward plain names (no dots)
local=/home.lan/

# Local DNS overrides
address=/router.home.lan/192.168.1.1
address=/nas.home.lan/192.168.1.10
address=/printer.home.lan/192.168.1.20
address=/pi.home.lan/192.168.1.50
address=/dev.home.lan/192.168.1.100

# DNS cache
cache-size=1000

# DNSSEC validation
dnssec

# DHCP configuration
dhcp-range=192.168.1.100,192.168.1.200,255.255.255.0,24h
dhcp-range=192.168.10.100,192.168.10.200,255.255.255.0,12h

# DHCP options: default gateway, DNS server
dhcp-option=option:router,192.168.1.1
dhcp-option=option:dns-server,192.168.1.1

# Static DHCP assignments (MAC -> IP)
dhcp-host=aa:bb:cc:dd:ee:01,nas,192.168.1.10
dhcp-host=aa:bb:cc:dd:ee:02,printer,192.168.1.20
dhcp-host=aa:bb:cc:dd:ee:03,pi,192.168.1.50

# Log DHCP transactions
log-dhcp
