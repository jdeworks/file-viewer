[package]
name = "file-viewer-demo"
version = "0.2.0"
edition = "2021"
description = "A demo crate for the Cargo.toml enhanced view"
license = "MIT"
repository = "https://github.com/example/file-viewer-demo"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"

[dev-dependencies]
criterion = "0.5"
