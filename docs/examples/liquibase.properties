# Liquibase configuration file
# https://docs.liquibase.com/concepts/connections/creating-config-properties.html

# The changelog file containing the database migration scripts
changeLogFile=db/changelog/db.changelog-master.xml

# Database connection URL (JDBC format)
url=jdbc:postgresql://db.example.com:5432/appdb

# Database username
username=liquibase_user

# Database password (use environment variable LB_PASSWORD in production)
password=changeme123

# JDBC driver class
driver=org.postgresql.Driver

# Default schema for migration objects
defaultSchemaName=public

# Schema where Liquibase stores its history table
liquibaseSchemaName=liquibase

# Reference database for diff operations (optional)
# referenceUrl=jdbc:postgresql://db-ref.example.com:5432/appdb_ref

# Output log level
logLevel=INFO

# Whether to run each changeset in its own transaction
changeSetAlwaysRun=false

# Classpath for additional jars
# classpath=/path/to/libs
