# ProFTPD configuration file

ServerName    "My ProFTPD Server"
ServerType    standalone
DefaultServer on

# Port
Port          21
Umask         022

# Access
User          proftpd
Group         proftpd
DefaultRoot   ~
RequireValidShell off

# Connections
MaxInstances  30
MaxClients    10 "Sorry, max %m users allowed"
TimeoutLogin  120
TimeoutIdle   600

# TLS
<IfModule mod_tls.c>
  TLSEngine on
  TLSLog /var/log/proftpd/tls.log
  TLSProtocol TLSv1.2 TLSv1.3
  TLSCertificateFile /etc/ssl/certs/proftpd.crt
  TLSCertificateKeyFile /etc/ssl/private/proftpd.key
  TLSRequired on
</IfModule>
