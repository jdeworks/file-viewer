[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020

[INPUT]
    Name          tail
    Path          /var/log/app/*.log
    Tag           app.*
    Parser        json
    Refresh_Interval 5
    Rotate_Wait  30

[INPUT]
    Name          systemd
    Tag           host.*
    Systemd_Filter _SYSTEMD_UNIT=sshd.service

[FILTER]
    Name          record_modifier
    Match         app.*
    Record        environment production
    Record        host ${HOSTNAME}

[FILTER]
    Name          grep
    Match         app.*
    Regex         level (warn|error|fatal)

[OUTPUT]
    Name          es
    Match         app.*
    Host          elasticsearch.example.com
    Port          9200
    Index         fluent-bit
    Type          _doc
    tls           On
    tls.verify    Off

[OUTPUT]
    Name          stdout
    Match         host.*
    Format        json_lines
