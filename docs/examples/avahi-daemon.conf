[server]
host-name=mydesktop
domain-name=local
use-ipv4=yes
use-ipv6=yes
allow-interfaces=eth0,wlan0
enable-dbus=yes
check-response-ttl=no
use-iff-running=no

[wide-area]
enable-wide-area=yes

[publish]
publish-hinfo=yes
publish-workstation=yes
publish-domain=yes
publish-resolv-conf-dns-servers=no
publish-aaaa-on-ipv4=yes
publish-a-on-ipv6=no

[reflector]
enable-reflector=no
reflect-ipv=no

[rlimits]
rlimit-core=0
rlimit-data=4194304
rlimit-fsize=0
rlimit-nofile=768
rlimit-stack=4194304
rlimit-nproc=3
