# vsftpd.conf - Very Secure FTP Daemon configuration

# Standalone mode
listen=YES
listen_ipv6=NO
listen_port=21

# Access control
anonymous_enable=NO
local_enable=YES
write_enable=YES
chroot_local_user=YES
allow_writeable_chroot=YES

# Passive mode port range
pasv_min_port=40000
pasv_max_port=50000
pasv_address=203.0.113.1

# SSL/TLS
ssl_enable=YES
force_local_data_ssl=YES
force_local_logins_ssl=YES
ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO
rsa_cert_file=/etc/ssl/certs/vsftpd.pem
rsa_private_key_file=/etc/ssl/private/vsftpd.key

# Logging
xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log
xferlog_std_format=YES

# Limits
max_clients=50
max_per_ip=10
ftpd_banner=Welcome to My FTP Server
