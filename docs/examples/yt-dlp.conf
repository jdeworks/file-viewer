# yt-dlp configuration

# Format: best video + best audio, prefer mp4/webm
--format bestvideo[ext=mp4]+bestaudio[ext=m4a]/bestvideo+bestaudio/best
--merge-output-format mp4

# Output template
--output ~/Downloads/%(uploader)s/%(upload_date)s - %(title)s [%(id)s].%(ext)s
--restrict-filenames

# Metadata and thumbnails
--embed-thumbnail
--embed-metadata
--embed-chapters
--embed-subs
--sub-langs en,de
--write-auto-subs

# Performance
--concurrent-fragments 4
--rate-limit 5M
--retries 10
--fragment-retries 10
--retry-sleep 5

# Cookies (for age-restricted content)
--cookies-from-browser firefox

# Misc
--mark-watched
--no-playlist
--sponsorblock-mark all
