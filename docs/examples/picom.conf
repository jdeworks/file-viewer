# picom compositor configuration
backend = "glx";
vsync = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;

# Shadows
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.7;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "_GTK_FRAME_EXTENTS@:c"
];

# Blur
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = true;
blur-kern = "3x3box";

# Corners
corner-radius = 10;
rounded-corners-exclude = [
    "class_g = 'Polybar'"
];

# Opacity
active-opacity = 1.0;
inactive-opacity = 0.9;
frame-opacity = 0.9;
inactive-opacity-override = false;
opacity-rule = [
    "90:class_g = 'Alacritty' && !focused",
    "85:class_g = 'Thunar'"
];

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;
no-fading-openclose = false;
