# NATS Server Configuration

# Basic settings
host: 0.0.0.0
port: 4222
http_port: 8222

# Logging
debug: false
trace: false
logtime: true
log_file: "/var/log/nats/nats.log"

# Authentication
authorization {
  user: nats_user
  password: changeme
  timeout: 1
}

# TLS
tls {
  cert_file: "/etc/nats/certs/server.crt"
  key_file:  "/etc/nats/certs/server.key"
  ca_file:   "/etc/nats/certs/ca.crt"
  verify:    true
}

# Cluster
cluster {
  name: my-nats-cluster
  host: 0.0.0.0
  port: 6222
  routes [
    nats-route://node1:6222
    nats-route://node2:6222
  ]
  connect_retries: 30
}

# JetStream
jetstream {
  store_dir: /var/nats/jetstream
  max_memory_store: 1GB
  max_file_store: 10GB
}
