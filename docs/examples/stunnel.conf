; stunnel global settings

; Certificate and key
cert = /etc/stunnel/stunnel.pem
key = /etc/stunnel/stunnel.key

; CA certificate for client verification
CAfile = /etc/ssl/certs/ca-certificates.crt
verify = 2

; Debug and logging
debug = 4
output = /var/log/stunnel.log

; PID file
pid = /var/run/stunnel.pid

; TLS settings
sslVersion = TLSv1.2
ciphers = HIGH:!aNULL:!MD5

; Accept SMTP and wrap with TLS
[smtp-tls]
client = no
accept = 0.0.0.0:465
connect = 127.0.0.1:25

; Connect to a remote database over TLS
[postgres-client]
client = yes
accept = 127.0.0.1:5433
connect = db.example.com:5432
verify = 3

; IMAP over TLS
[imap-tls]
client = no
accept = 0.0.0.0:993
connect = 127.0.0.1:143
cert = /etc/stunnel/imap.pem
