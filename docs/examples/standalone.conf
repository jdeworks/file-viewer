#
# Apache Pulsar standalone broker configuration
# https://pulsar.apache.org/docs/administration-configuration/
#

# Cluster name
clusterName=standalone

# ZooKeeper connection string (embedded in standalone mode)
zookeeperServers=localhost:2181
configurationStoreServers=localhost:2181

# Broker service ports
brokerServicePort=6650
brokerServicePortTls=6651

# Web service ports
webServicePort=8080
webServicePortTls=8443

# BookKeeper ensemble and quorum settings
managedLedgerDefaultEnsembleSize=1
managedLedgerDefaultWriteQuorum=1
managedLedgerDefaultAckQuorum=1

# BookKeeper storage directories
journalDirectory=data/standalone/bookkeeper/journal
ledgerDirectories=data/standalone/bookkeeper/ledgers

# Ledger storage implementation
ledgerStorageClass=org.apache.bookkeeper.bookie.storage.ldb.DbLedgerStorage

# Authentication (disabled for standalone)
authenticationEnabled=false
authorizationEnabled=false

# TLS (disabled for standalone)
tlsEnabled=false
# tlsCertificateFilePath=/path/to/broker-cert.pem
# tlsKeyFilePath=/path/to/broker-key.pem

# Function worker settings
functionsWorkerEnabled=true

# Standalone mode: use embedded ZooKeeper and BookKeeper
isStandaloneMode=true
allowAutoTopicCreation=true
defaultNumberOfNamespaceBundles=4
