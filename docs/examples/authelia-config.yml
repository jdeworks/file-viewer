---
# Authelia configuration example

server:
  host: 0.0.0.0
  port: 9091

log:
  level: info

authentication_backend:
  ldap:
    url: ldap://ldap.example.com
    base_dn: DC=example,DC=com
    user: CN=serviceaccount,DC=example,DC=com
    password: EXAMPLE_PASSWORD_DO_NOT_USE
    users_filter: (&({username_attribute}={input})(objectClass=person))
    groups_filter: (&(member={dn})(objectClass=groupOfNames))

session:
  name: authelia_session
  domain: example.com
  expiration: 3600
  inactivity: 300

access_control:
  default_policy: deny
  rules:
    - domain: public.example.com
      policy: bypass
    - domain: "*.example.com"
      subject:
        - "group:admins"
      policy: two_factor
      resources:
        - "^/admin/.*$"

identity_providers:
  oidc:
    clients:
      - id: myapp
        description: My Application
        secret: EXAMPLE_OIDC_SECRET_DO_NOT_USE
        redirect_uris:
          - https://app.example.com/oauth2/callback
          - https://app.example.com/login
        scopes:
          - openid
          - profile
          - email
        grant_types:
          - authorization_code
