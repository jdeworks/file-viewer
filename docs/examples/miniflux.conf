# Miniflux RSS Reader configuration
# https://miniflux.app/docs/configuration.html

LISTEN_ADDR=0.0.0.0:8080
BASE_URL=https://rss.example.com
HTTPS=1

DATABASE_URL=postgres://miniflux:changeme@localhost/miniflux?sslmode=disable

OAUTH2_CLIENT_ID=my-oauth2-client
OAUTH2_CLIENT_SECRET=my-oauth2-secret
DISABLE_LOCAL_AUTH=0

POLLING_FREQUENCY=60
POLLING_PARSING_ERROR_LIMIT=3
BATCH_SIZE=100

ADMIN_USERNAME=admin
ADMIN_PASSWORD=supersecretpassword
