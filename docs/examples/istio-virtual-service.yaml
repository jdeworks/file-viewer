apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: bookinfo
  namespace: default
spec:
  hosts:
    - bookinfo.example.com
    - bookinfo
  gateways:
    - bookinfo-gateway
    - mesh
  http:
    - name: reviews-v2-route
      match:
        - headers:
            end-user:
              exact: jason
          uri:
            prefix: /reviews
      route:
        - destination:
            host: reviews
            subset: v2
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 3s
    - name: productpage-route
      match:
        - uri:
            exact: /productpage
        - uri:
            prefix: /static
      route:
        - destination:
            host: productpage
            subset: v1
            port:
              number: 9080
    - name: default-reviews
      route:
        - destination:
            host: reviews
            subset: v1
          weight: 80
        - destination:
            host: reviews
            subset: v3
          weight: 20
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: reviews
  namespace: default
spec:
  host: reviews
  trafficPolicy:
    loadBalancer:
      simple: LEAST_CONN
    connectionPool:
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
      tcp:
        maxConnections: 100
    outlierDetection:
      consecutiveErrors: 5
      interval: 30s
      baseEjectionTime: 30s
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
    - name: v3
      labels:
        version: v3
