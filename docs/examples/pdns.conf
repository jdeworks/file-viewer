# PowerDNS Authoritative Server Configuration

# Backend
launch=bind
bind-config=/etc/pdns/named.conf
bind-check-interval=300

# Network
local-address=0.0.0.0
local-port=53
socket-dir=/var/run/pdns

# API
api=yes
api-key=super-secret-api-key
webserver=yes
webserver-address=127.0.0.1
webserver-port=8081
webserver-allow-from=127.0.0.1

# Zone transfers
primary=yes
allow-axfr-ips=10.0.0.0/8
also-notify=10.0.0.2

# DNSSEC
default-dnssec=off

# Logging
loglevel=4
log-dns-queries=no

# Performance
max-tcp-connections=20
receiver-threads=2
distributor-threads=2
guardian=yes
