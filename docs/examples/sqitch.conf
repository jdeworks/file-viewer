[core]
	engine = pg
	plan_file = sqitch.plan
	top_dir = migrations

[engine "pg"]
	target = db:pg:appdb
	registry = sqitch
	client = psql

[target "dev"]
	uri = db:pg://sqitch_user:devpassword@localhost:5432/appdb_dev
	registry = sqitch

[target "staging"]
	uri = db:pg://sqitch_user:stgpassword@db-staging.example.com:5432/appdb_staging
	registry = sqitch

[target "production"]
	uri = db:pg://sqitch_ro:prodpassword@db.example.com:5432/appdb
	registry = sqitch

[user]
	name = Database Team
	email = dba@example.com
