# mpv configuration

# Video
vo=gpu-next
hwdec=auto-safe
gpu-context=auto
video-sync=display-resample
tscale=oversample
scale=ewa_lanczos
cscale=ewa_lanczos
dscale=mitchell
correct-downscaling=yes
sigmoid-upscaling=yes

# Audio
ao=pipewire
audio-channels=stereo
volume=80
volume-max=150
audio-pitch-correction=yes

# Subtitles
sub-auto=fuzzy
sub-font=Noto Sans
sub-font-size=44
sub-color=#FFFFFFFF
sub-border-size=3
sub-border-color=#000000FF
sub-shadow-offset=0
sub-ass-override=force

# Cache / performance
cache=yes
demuxer-max-bytes=500MiB
demuxer-max-back-bytes=200MiB

# OSD
osd-font=Noto Sans
osd-font-size=24

# Misc
save-position-on-quit=yes
keep-open=yes
autofit-larger=80%x80%

[protocol.http]
hls-bitrate=max
cache=yes
no-cache-pause

[high-quality]
profile=gpu-hq
deband=yes
deband-iterations=4
deband-threshold=35
deband-range=16
deband-grain=4
