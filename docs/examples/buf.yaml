version: v2

modules:
  - path: proto
    lint:
      use:
        - STANDARD
      except:
        - FIELD_NOT_REQUIRED
        - PACKAGE_NO_IMPORT_CYCLE
      ignore:
        - google/protobuf
    breaking:
      use:
        - FILE

deps:
  - buf.build/googleapis/googleapis
  - buf.build/grpc-ecosystem/grpc-gateway

lint:
  use:
    - STANDARD
    - COMMENTS
  except:
    - FIELD_NOT_REQUIRED
  ignore:
    - proto/google

breaking:
  use:
    - FILE
    - WIRE_JSON
