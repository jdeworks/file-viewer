# /etc/modprobe.d/blacklist.conf - Kernel module blacklist

# Disable Bluetooth
blacklist bluetooth
blacklist btusb
blacklist bnep
blacklist rfcomm

# Disable USB storage (security hardening)
blacklist usb-storage

# Disable webcam (privacy)
blacklist uvcvideo

# Disable legacy protocols
blacklist dccp
blacklist sctp
blacklist rds
blacklist tipc

# GPU - force use of open-source driver
blacklist nvidia
blacklist nvidia_drm
blacklist nvidia_modeset

# Options for loaded modules
options nf_conntrack hashsize=65536
options i915 modeset=1 enable_guc=3
options snd_hda_intel power_save=1 power_save_controller=y

# Alias
alias net-pf-10 off
