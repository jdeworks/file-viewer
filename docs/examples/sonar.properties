# SonarQube Server Configuration
# https://docs.sonarsource.com/sonarqube/latest/setup-and-upgrade/configure-and-operate-a-server/

#--------------------------------------------------------------------------------------------------
# WEB SERVER
sonar.web.host=0.0.0.0
sonar.web.port=9000
sonar.web.context=/sonarqube
sonar.web.javaAdditionalOpts=-server

#--------------------------------------------------------------------------------------------------
# DATABASE
sonar.jdbc.url=jdbc:postgresql://sonarqube:secret@db.internal/sonardb
sonar.jdbc.username=sonarqube
sonar.jdbc.password=s3cur3p@ssword
sonar.jdbc.maxActive=60

#--------------------------------------------------------------------------------------------------
# ELASTICSEARCH
sonar.search.host=127.0.0.1
sonar.search.port=9001
sonar.search.javaAdditionalOpts=-Xmx1g -Xms512m

#--------------------------------------------------------------------------------------------------
# LOGGING
sonar.log.level=INFO
sonar.path.logs=/opt/sonarqube/logs
sonar.log.rollingPolicy=time:yyyy-MM-dd

#--------------------------------------------------------------------------------------------------
# AUTHENTICATION
sonar.forceAuthentication=true
sonar.auth.github.enabled=true
sonar.auth.github.clientId=Iv1.a1b2c3d4e5f6a7b8
sonar.auth.github.clientSecret=my_github_oauth_secret_value
sonar.auth.saml.enabled=false

#--------------------------------------------------------------------------------------------------
# SECURITY
sonar.secretKeyPath=/opt/sonarqube/conf/sonar-secret.txt

#--------------------------------------------------------------------------------------------------
# PATHS
sonar.path.data=/opt/sonarqube/data
sonar.path.temp=/opt/sonarqube/temp
