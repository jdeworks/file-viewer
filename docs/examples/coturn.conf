# coturn TURN server configuration
# https://github.com/coturn/coturn/wiki/turnserver

# Network settings
listening-ip=0.0.0.0
listening-port=3478
tls-listening-port=5349
alt-listening-port=3479

# External IP (NAT traversal)
external-ip=203.0.113.1

# Realm
realm=turn.example.com

# Authentication: use ephemeral HMAC credentials (for WebRTC)
use-auth-secret
static-auth-secret=change_me_turn_secret_placeholder

# TLS certificates
cert=/etc/coturn/cert.pem
pkey=/etc/coturn/key.pem

# Disable old TLS versions
no-tlsv1
no-tlsv1_1

# Relay port range (for media relay)
min-port=49152
max-port=65535

# Relay address
relay-ip=203.0.113.1

# Logging
log-file=/var/log/coturn/turnserver.log
syslog

# Security flags
fingerprint
lt-cred-mech

# Deny relay to private/loopback ranges
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Database (for long-term credentials, optional)
# userdb=/var/lib/coturn/turndb

# CLI access
# cli-password=change_me_cli_password

# Verbose logging (disable in production)
verbose
