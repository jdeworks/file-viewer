[main]
gpgcheck=1
installonly_limit=3
clean_requirements_on_remove=True
skip_if_unavailable=False
best=True
countme=False

# Cache settings
cachedir=/var/cache/dnf
keepcache=0
metadata_expire=172800

# Performance
fastestmirror=True
max_parallel_downloads=10
minrate=1000
timeout=30
retries=10

# Security
localpkg_gpgcheck=False
obsoletes=1
deltarpm=True
deltarpm_percentage=75
