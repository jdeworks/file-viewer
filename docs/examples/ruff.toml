line-length = 100
target-version = "py311"
exclude = [
  ".git",
  ".venv",
  "__pycache__",
  "build",
  "dist",
  "migrations",
]

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "N805", "SIM108"]
fixable = ["ALL"]
unfixable = []

[lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]
"scripts/**" = ["T201"]

[format]
quote-style = "double"
indent-style = "space"
