APP_NAME = My Gitea Instance
RUN_MODE = prod
RUN_USER = git

[server]
PROTOCOL         = https
HTTP_ADDR        = 0.0.0.0
HTTP_PORT        = 3000
ROOT_URL         = https://git.example.com/
DOMAIN           = git.example.com
SSH_DOMAIN       = git.example.com
SSH_PORT         = 22
DISABLE_SSH      = false
LFS_START_SERVER = true

[repository]
ROOT                     = /home/git/gitea-repositories
DEFAULT_BRANCH           = main
ENABLE_PUSH_CREATE_USER  = false

[database]
DB_TYPE  = postgres
HOST     = localhost:5432
NAME     = gitea
USER     = gitea
PASSWD   = supersecretpassword
SSL_MODE = disable

[mailer]
ENABLED        = true
SMTP_ADDR      = smtp.example.com
SMTP_PORT      = 587
FROM           = noreply@example.com
USER           = smtp-user@example.com
PASSWD         = smtp-password-here
IS_TLS_ENABLED = true

[service]
REQUIRE_SIGNIN_VIEW         = false
DISABLE_REGISTRATION        = true
ENABLE_CAPTCHA              = false
DEFAULT_KEEP_EMAIL_PRIVATE  = true

[security]
INSTALL_LOCK   = true
SECRET_KEY     = longrandombytesstring
INTERNAL_TOKEN = eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.FAKE_TOKEN

[cache]
ADAPTER = redis
HOST    = redis://localhost:6379/0

[session]
PROVIDER        = redis
PROVIDER_CONFIG = redis://localhost:6379/1

[log]
ROOT_PATH = /home/git/gitea/log
MODE      = console, file
LEVEL     = Info

[actions]
ENABLED = true

[oauth2]
ENABLE     = true
JWT_SECRET = anothersecret
