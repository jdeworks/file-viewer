# Flyway configuration file
# https://documentation.red-gate.com/fd/flyway-documentation-138346877.html

# The JDBC url to use to connect to the database
flyway.url=jdbc:postgresql://localhost:5432/myapp_db

# The user to use to connect to the database
flyway.user=flyway_user

# The password to use to connect to the database (use secrets management in production)
flyway.password=changeme

# Comma-separated list of locations to scan recursively for migrations
flyway.locations=filesystem:db/migration,classpath:db/migration

# Schemas managed by Flyway. Flyway will attempt to create these schemas if they don't exist.
flyway.schemas=public

# The name of Flyway's schema history table
flyway.table=flyway_schema_history

# The target version up to which Flyway should consider migrations. Defaults to latest.
# flyway.target=5

# Encoding of SQL migrations
flyway.encoding=UTF-8

# Whether to allow mixing transactional and non-transactional statements within the same migration
# flyway.mixed=false

# Whether to group all pending migrations together in the same transaction when applying them (only recommended for databases with support for DDL transactions)
# flyway.group=false

# The version to tag an existing schema with when executing baseline
flyway.baselineVersion=1

# Whether to automatically call baseline when migrate is executed against a non-empty schema with no metadata table
flyway.baselineOnMigrate=false

# Whether Flyway should skip the default callbacks. If true, only custom callbacks are used.
# flyway.skipDefaultCallbacks=false

# Whether Flyway should skip the default resolvers. If true, only custom resolvers are used.
# flyway.skipDefaultResolvers=false

# Whether to allow migrations to be run out of order
flyway.outOfOrder=false

# Whether to validate migrations on the fly
flyway.validateOnMigrate=true

# Whether to automatically call clean or not when a validation error occurs
# cleanOnValidationError is dangerous and should not be enabled in production
# flyway.cleanOnValidationError=false

# Whether to disable Flyway's clean command. This is especially useful for production environments
# where running clean can be catastrophic.
flyway.cleanDisabled=true
