name: my-crystal-app
version: 0.4.2
description: A sample Crystal web application using Kemal framework

authors:
  - Carol Williams <carol@example.com>
  - Dave Lee <dave@example.com>

crystal: ">= 1.10.0"

license: MIT

dependencies:
  kemal:
    github: kemalcr/kemal
    version: ~> 1.6
  db:
    github: crystal-lang/crystal-db
