  pg:
    github: will/crystal-pg
    version: ~> 0.28
  redis:
    git: https://github.com/jwoertink/redis.cr.git
    branch: master
  dotenv:
    github: gdotdesign/cr-dotenv
    version: ~> 1.0

development_dependencies:
  spectator:
    github: icy-arctic-fox/spectator
    version: ~> 0.11
  ameba:
    github: crystal-ameba/ameba
    version: ~> 1.5
