network:
  version: 2
  renderer: networkd

  ethernets:
    eth0:
      dhcp4: true
      dhcp6: false

    eth1:
      dhcp4: false
      addresses:
        - 192.168.1.100/24
      gateway4: 192.168.1.1
      nameservers:
        addresses:
          - 8.8.8.8
          - 8.8.4.4
        search:
          - example.com
      mtu: 1500

  wifis:
    wlan0:
      dhcp4: true
      access-points:
        "OfficeWiFi":
          password: "s3cr3t-passphrase"
        "GuestNetwork":
          {}
