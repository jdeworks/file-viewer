version: "3.9"

services:
  web:
    build: .
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - api
      - cache
    restart: unless-stopped

  api:
    image: node:20-alpine
    working_dir: /app
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - REDIS_URL=redis://cache:6379
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
    depends_on:
      - db
      - cache
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=appdb
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=secret
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pg_data:
