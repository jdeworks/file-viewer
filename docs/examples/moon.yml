# https://moonrepo.dev/docs/config/project
$schema: 'https://moonrepo.dev/schemas/project.json'

project:
  name: 'web-app'
  description: 'Frontend web application'
  type: 'application'
  language: 'node'
  owner: 'frontend-team'

language: 'node'

dependsOn:
  - 'shared-ui'
  - 'design-tokens'
  - id: 'api-client'
    scope: 'peer'

tasks:
  build:
    command: 'vite build'
    platform: 'node'
    inputs:
      - 'src/**/*'
      - 'public/**/*'
    outputs:
      - 'dist/**/*'

  dev:
    command: 'vite dev'
    platform: 'node'
    local: true

  test:
    command: 'vitest run'
    platform: 'node'
    inputs:
      - 'src/**/*.test.ts'
    deps:
      - 'build'

  lint:
    command: 'eslint src'
    platform: 'node'
    inputs:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'

  format:
    command: 'prettier --write src'
    platform: 'node'
    inputs:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
