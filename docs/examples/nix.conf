# /etc/nix/nix.conf — Nix daemon configuration
# See: https://nixos.org/manual/nix/stable/command-ref/conf-file

# Enable experimental features (nix-command and flakes are widely used)
experimental-features = nix-command flakes ca-derivations

# Binary caches (substituters)
substituters = https://cache.nixos.org https://nix-community.cachix.org

# Trust the community Nix cache key
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCUSI=

# Users who can override sandbox, specify binary caches, etc.
trusted-users = root @wheel

# Allow all local users to use nix
allowed-users = *

# Build concurrency: "auto" uses all available CPU cores
max-jobs = auto

# Cores per build job (0 = all available)
cores = 0

# Enable build sandboxing for reproducibility
sandbox = true

# Automatically hard-link identical files in the Nix store
auto-optimise-store = true

# Keep build outputs to allow inspecting failed builds
keep-outputs = true

# Keep derivations so nix-store --query --deriver works
keep-derivations = true

# Cross-compilation support (uncomment if needed)
# extra-platforms = aarch64-linux x86_64-linux
