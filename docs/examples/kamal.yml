service: myapp
image: ghcr.io/myorg/myapp

servers:
  web:
    - 10.0.0.1
    - 10.0.0.2
  worker:
    - 10.0.0.3

registry:
  server: ghcr.io
  username: myorg
  password:
    - KAMAL_REGISTRY_PASSWORD

proxy:
  ssl: true
  host: myapp.example.com
  app_port: 3000
  healthcheck:
    path: /up
    port: 3000
    interval: 3
    threshold: 5

env:
  clear:
    RAILS_ENV: production
    DATABASE_POOL: "5"
    REDIS_URL: redis://redis:6379/0
    LOG_LEVEL: info
  secret:
    - DATABASE_URL
    - SECRET_KEY_BASE
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - STRIPE_API_KEY

volumes:
  - /data/myapp/storage:/rails/storage
  - /data/myapp/logs:/rails/log

labels:
  traefik.enable: "true"
  traefik.http.routers.myapp.rule: "Host(`myapp.example.com`)"
  traefik.http.services.myapp.loadbalancer.server.port: "3000"

accessories:
  db:
    image: postgres:16
    host: 10.0.0.4
    port: 5432
    env:
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - /data/postgres:/var/lib/postgresql/data
  redis:
    image: redis:7
    host: 10.0.0.4
    port: 6379
    volumes:
      - /data/redis:/data

boot:
  limit: 10
  wait: 2
