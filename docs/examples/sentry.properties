# Sentry SDK configuration for Android/Java
# https://docs.sentry.io/platforms/android/configuration/options/

sentry.dsn=https://abcdef1234567890@o123456.ingest.sentry.io/9876543
sentry.release=com.example.myapp@2.4.1+42
sentry.environment=production
sentry.org=example-org
sentry.project=my-android-app

# Native symbol upload settings
sentry.uploadNativeSymbols=true
sentry.includeNativeSources=true
upload-sources=true

# Performance monitoring
sentry.tracesSampleRate=0.2
sentry.profilesSampleRate=0.1
sentry.enableAutoActivityLifecycleTracing=true

# Breadcrumbs and session tracking
sentry.maxBreadcrumbs=50
sentry.enableUserInteractionTracing=true
sentry.sendDefaultPii=false
