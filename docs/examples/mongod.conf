systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

storage:
  dbPath: /var/lib/mongodb
  journal:
    enabled: true
  engine: wiredTiger

net:
  port: 27017
  bindIp: 127.0.0.1,::1

replication:
  replSetName: rs0
  oplogSizeMB: 1024

security:
  authorization: enabled
  keyFile: /etc/mongodb/keyfile

processManagement:
  pidFilePath: /var/run/mongodb/mongod.pid
