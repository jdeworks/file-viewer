apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

namePrefix: prod-

resources:
  - ../../base
  - extra-service.yaml
  - network-policy.yaml

patchesStrategicMerge:
  - replica-count.yaml
  - resource-limits.yaml

configMapGenerator:
  - name: app-config
    literals:
      - ENV=production
      - LOG_LEVEL=warn
  - name: feature-flags
    files:
      - flags.properties

images:
  - name: my-webapp
    newTag: v1.5.0
    newName: registry.example.com/my-webapp
