<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theme contrast showcase</title>
  <style>
    body { max-width: 760px; margin: 0 auto; padding: 2rem; font: 16px/1.55 system-ui, sans-serif; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1rem; }
    article { padding: 1rem; border: 1px solid currentColor; border-radius: .6rem; }
    code { padding: .15rem .35rem; border-radius: .25rem; background: color-mix(in srgb, currentColor 12%, transparent); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .45rem; border-bottom: 1px solid currentColor; text-align: left; }
  </style>
</head>
<body>
  <h1>Light and dark theme contrast</h1>
  <p>This local document exercises headings, links, <code>inline code</code>, borders, tables, and controls without remote resources.</p>
  <div class="cards">
    <article><h2>Status</h2><p><strong>Ready</strong> · muted supporting copy</p></article>
    <article><h2>Action</h2><p><a href="#details">Jump to details</a></p><button type="button">Local button</button></article>
  </div>
  <h2 id="details">Details</h2>
  <table><thead><tr><th>Surface</th><th>Expectation</th></tr></thead><tbody><tr><td>Light</td><td>Dark text, pale canvas</td></tr><tr><td>Dark</td><td>Pale text, dark canvas</td></tr></tbody></table>
</body>
</html>
