apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-backup
  namespace: velero
spec:
  schedule: "0 2 * * *"
  template:
    ttl: 720h
    storageLocation: aws-backup
    includedNamespaces:
      - production
      - staging
    excludedNamespaces:
      - kube-system
    includeClusterResources: true
    snapshotVolumes: true
