# netdata configuration
# See https://learn.netdata.cloud/docs/configuring/daemon-configuration

[global]
    hostname = web-server-01
    history = 3996
    update every = 1
    memory mode = ram
    bind socket to IP = 127.0.0.1
    run as user = netdata
    web files owner = root
    errors flood protection period = 1200
    errors to trigger flood protection = 200

[web]
    bind to = 127.0.0.1:19999
    web files owner = root
    web files group = root
    disconnect idle clients after seconds = 60
    allow connections from = localhost 192.168.1.*

[plugins]
    proc = yes
    diskspace = yes
    cgroups = yes
    tc = no
    nfacct = no
    python.d = yes
    go.d = yes
    charts.d = no
    node.d = no
    apps = yes
    fping = no
    ioping = no

[health]
    enabled = yes
    health configuration directory = /etc/netdata/health.d
    run at least every seconds = 10
    postpone alarms during hibernation for seconds = 60

[backend]
    enabled = yes
    type = prometheus
    destination = localhost:9103
    prefix = netdata
    update every = 10
    buffer on failures = 10
    timeout ms = 20000
    send names instead of ids = yes
