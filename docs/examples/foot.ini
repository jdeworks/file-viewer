[main]
font=JetBrains Mono:size=11
dpi-aware=auto
initial-window-size-pixels=1280x720
pad=6x4 center
notify=notify-send -a ${app-id} -i ${app-id} ${title} ${body}
word-constituents=_-./:

[scrollback]
lines=50000
multiplier=3

[mouse]
hide-when-typing=yes

[colors]
alpha=0.95
foreground=cdd6f4
background=1e1e2e
regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=f5c2e7
regular6=94e2d5
regular7=bac2de
bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=f5c2e7
bright6=94e2d5
bright7=a6e3a1

[key-bindings]
spawn-terminal=ctrl+shift+n
close-terminal=ctrl+shift+q
search-start=ctrl+shift+r
font-increase=ctrl+plus
font-decrease=ctrl+minus
font-reset=ctrl+equal
clipboard-copy=ctrl+shift+c
clipboard-paste=ctrl+shift+v
primary-paste=shift+Insert

[url]
launch=xdg-open ${url}
