# nsqd configuration
# https://nsq.io/components/nsqd.html

# Network addresses
tcp-address = 0.0.0.0:4150
http-address = 0.0.0.0:4151
https-address = 0.0.0.0:4152

# Broadcast address (the address clients will use to connect)
broadcast-address = nsqd.example.com

# Lookupd addresses (can be repeated for multiple lookupd instances)
lookupd-tcp-address = lookupd1.example.com:4160
lookupd-tcp-address = lookupd2.example.com:4160

# Data storage
data-path = /var/lib/nsq
mem-queue-size = 10000
max-bytes-per-file = 104857600
sync-every = 2500
sync-timeout = 2s

# Message settings
msg-timeout = 60s
req-timeout = 1h
max-req-timeout = 1h
heartbeat-interval = 30s
client-timeout = 60s

# Message size limits
max-msg-size = 1048576
max-body-size = 5242880
max-channel-consumers = 0

# Heartbeat and connection
max-heartbeat-interval = 5m
max-rdy-count = 2500
max-output-buffer-size = 65536
max-output-buffer-timeout = 250ms

# TLS settings
tls-required = false
tls-cert = /etc/nsq/certs/server.crt
tls-key = /etc/nsq/certs/server.key
tls-root-ca-file = /etc/nsq/certs/ca.crt
tls-client-auth-policy = require-verify
tls-min-version = tls1.2

# Auth (optional HTTP auth endpoint)
# auth-http-address = 127.0.0.1:4181

# Deflate and snappy compression
deflate = true
max-deflate-level = 6
snappy = true

# Statsd metrics
statsd-address = 127.0.0.1:8125
statsd-prefix = nsq.%s
statsd-interval = 60s
statsd-mem-stats = true

# Logging
log-level = info
