pageInfo:
  title: My Dashboard
  description: Self-hosted services dashboard
  logo: https://i.ibb.co/r5T3MwM/dashy-logo.png
  navLinks:
    - title: GitHub
      path: https://github.com
    - title: Docs
      path: https://dashy.to/docs

appConfig:
  theme: colorful
  layout: auto
  iconSize: medium
  language: en
  statusCheck: false
  disableConfigurationButton: false

sections:
  - name: 📺 Media
    displayData:
      cols: 2
    items:
