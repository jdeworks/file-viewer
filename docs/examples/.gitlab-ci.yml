image: node:20-alpine

stages:
  - install
  - lint
  - test
  - build
  - deploy

variables:
  NODE_ENV: test
  CACHE_KEY: v1-node-${CI_COMMIT_REF_SLUG}
  DOCKER_DRIVER: overlay2

cache:
  key: ${CACHE_KEY}
  paths:
    - node_modules/
    - .npm/

install:
  stage: install
  script:
    - npm ci --cache .npm --prefer-offline
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

lint:
  stage: lint
  script:
    - npm run lint
    - npm run type-check
  needs: [install]

test:unit:
  stage: test
  script:
    - npm test -- --coverage
  coverage: '/Lines\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
  needs: [install]

test:e2e:
  stage: test
  script:
    - npm run test:e2e
  needs: [install]

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
  needs: [lint, test:unit]

deploy:staging:
  stage: deploy
  script:
    - npm run deploy:staging
  environment:
    name: staging
    url: https://staging.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs: [build]
