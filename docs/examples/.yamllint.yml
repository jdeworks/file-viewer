extends: default

rules:
  line-length:
    max: 120
    level: warning
  indentation:
    spaces: 2
    indent-sequences: true
    check-multi-line-strings: false
  truthy:
    allowed-values: ["true", "false", "yes", "no"]
    check-keys: true
  comments:
    min-spaces-from-content: 1
  document-start:
    present: false
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
