name: jaffle_shop
version: '1.0.0'
config-version: 2

profile: jaffle_shop

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

require-dbt-version: ">=1.5.0"

models:
  jaffle_shop:
    +materialized: view
    staging:
      +materialized: view
      +schema: staging
      +tags:
        - staging
    marts:
      +materialized: table
      core:
        +materialized: table
        +schema: core
      finance:
        +materialized: incremental
        +schema: finance
        +unique_key: id

seeds:
  jaffle_shop:
    +schema: seeds
    +column_types:
      id: bigint

snapshots:
  jaffle_shop:
    target_schema: snapshots

vars:
  start_date: '2020-01-01'
  payment_method_threshold: 100
  use_fivetran_utils: false
  environment: dev
