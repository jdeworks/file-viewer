coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 2%
        informational: false
    patch:
      default:
        target: 70%
        threshold: 5%
        informational: true
  precision: 2
  round: down
  range: "70...100"

flags:
  - unit
  - integration

ignore:
  - "**/*.test.ts"
  - "**/*.spec.ts"
  - "src/test/**"
  - "coverage/**"
  - "dist/**"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

carryforward_flags:
  - unit
  - integration
