codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: 80%
        threshold: 1%
        if_ci_failed: error
    patch:
      default:
        target: 75%
        threshold: 2%
  ignore:
    - "**/*.test.ts"
    - "**/*.spec.ts"
    - "docs/**"
    - "coverage/**"

parsers:
  javascript:
    enable_partials: yes

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: no
  require_base: no

flags:
  frontend:
    paths:
      - src/
    carryforward: false
  backend:
    paths:
      - api/
    carryforward: true
