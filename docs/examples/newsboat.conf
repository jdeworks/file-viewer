# newsboat configuration

# Auto-reload
auto-reload yes
reload-time 30
refresh-on-startup yes
reload-threads 4

# Feed display
show-read-feeds yes
show-read-articles yes
max-items 100
keep-articles-days 30

# Formats
articlelist-format "%4i %f %D  %?T?%-17T ?%t"
feedlist-format    "%4i %n %11u %t"
datetime-format    "%Y-%m-%d %H:%M"

# Browser
browser "xdg-open %u"

# Colors
color background         default  default
color listnormal         default  default
color listfocus          black    yellow   bold
color listnormal_unread  blue     default  bold
color listfocus_unread   black    yellow   bold
color info               black    yellow
color article            default  default

# Key bindings
bind-key j down
bind-key k up
bind-key J next-feed articlelist
bind-key K prev-feed articlelist
bind-key g home
bind-key G end
bind-key l open
bind-key h quit
bind-key a toggle-article-read
bind-key n next-unread
bind-key N prev-unread
bind-key D pb-download
bind-key u show-urls
bind-key x pb-delete

# Notification
notify-program "/usr/bin/notify-send"
notify-format "newsboat: %d new article(s) in %n feed(s)"
notify-always no
