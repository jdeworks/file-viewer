[options]
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/opt/odoo/addons
data_dir = /var/lib/odoo

db_host = localhost
db_port = 5432
db_name = odoo
db_user = odoo
db_password = CHANGE_ME_DB_PASSWORD

admin_passwd = CHANGE_ME_MASTER_PASSWORD

