global:
  resolve_timeout: 5m
  slack_api_url: https://hooks.slack.com/services/EXAMPLE

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: default-receiver
  group_by:
    - alertname
    - env
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: pagerduty-critical
      group_wait: 10s

receivers:
  - name: default-receiver
    slack_configs:
      - channel: '#alerts'
        title: '{{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}'

  - name: pagerduty-critical
    pagerduty_configs:
      - routing_key: EXAMPLE_ROUTING_KEY
        description: '{{ .CommonAnnotations.summary }}'

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal:
      - alertname
      - env

mute_time_intervals:
  - name: weekend-maintenance
    time_intervals:
      - weekdays:
          - saturday
          - sunday
        times:
          - start_time: '00:00'
            end_time: '23:59'
