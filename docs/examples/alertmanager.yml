global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alertmanager@example.com'
  smtp_auth_username: 'alertmanager@example.com'
  smtp_auth_password: 'secret-password'
  slack_api_url: 'https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXX'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: pagerduty
      continue: false
    - match:
        severity: warning
      receiver: slack
    - match_re:
        service: ^(db|cache).*
      receiver: database-team

receivers:
  - name: 'default'
    email_configs:
      - to: 'ops@example.com'
        subject: '{{ .GroupLabels.alertname }}'
  - name: 'pagerduty'
    pagerduty_configs:
      - service_key: 'secret-pagerduty-key'
  - name: 'slack'
    slack_configs:
      - channel: '#alerts'
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}'
  - name: 'database-team'
    email_configs:
      - to: 'dba@example.com'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
