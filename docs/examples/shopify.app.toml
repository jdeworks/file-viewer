# Learn more about configuring your app at https://shopify.dev/docs/apps/build/cli-for-apps/app-configuration

name = "My Awesome Store App"
handle = "my-awesome-store-app"
client_id = "abcdef1234567890abcdef1234567890"
application_url = "https://myapp.example.com"
embedded = true

[access_scopes]
scopes = "read_products,write_products,read_orders,write_orders,read_customers,read_inventory,write_inventory"

[auth]
redirect_urls = [
  "https://myapp.example.com/auth/callback",
  "https://myapp.example.com/auth/shopify/callback",
  "https://staging.myapp.example.com/auth/callback"
]

[webhooks]
api_version = "2024-01"

[[webhooks.subscriptions]]
topics = ["orders/create", "orders/updated", "orders/cancelled"]
uri = "https://myapp.example.com/webhooks/orders"

[[webhooks.subscriptions]]
topics = ["products/create", "products/update"]
uri = "https://myapp.example.com/webhooks/products"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "https://myapp.example.com/webhooks/app-uninstalled"

[[extension]]
type = "ui_extension"
handle = "product-widget"
name = "Product Widget"
extension_points = ["Product::MediaCard"]

[[extension]]
type = "theme_app_extension"
handle = "storefront-theme"
name = "Storefront Theme Extension"

[pos]
embedded_in_pos = false
