version: 1

web:
  listen:
    port: 8080
    host: 0.0.0.0
    basepath: ""
  database:
    location: /opt/scrutiny/config/scrutiny.db
  src:
    frontend:
      path: /opt/scrutiny/web
  influxdb:
    host: localhost
    port: 8086
    token: ""
    org: scrutiny
    bucket: metrics

notify:
  urls:
    - "discord://xxx/yyy"
    - "slack://tokenA/tokenB/tokenC"
    - "smtp://user:password@host:587/?fromAddress=from@example.com&toAddresses=to@example.com"

log:
  file: ""
  level: INFO
