# Telegraf Configuration
# Global configuration for the metrics agent

[agent]
  ## Default data collection interval for all inputs
  interval = "10s"

  ## Rounds collection interval to 'interval'
  round_interval = true

  ## Telegraf will send metrics to outputs in batches of at most metric_batch_size.
  metric_batch_size = 1000

  ## Maximum number of unwritten metrics per output.
  metric_buffer_limit = 10000

  ## Collection jitter is used to jitter the collection by a random amount.
  collection_jitter = "0s"

  ## Default flushing interval for all outputs.
  flush_interval = "10s"

  ## Jitter the flush interval by a random amount.
  flush_jitter = "0s"

  ## Override default hostname, if empty use os.Hostname()
  hostname = "prod-metrics-01"

  ## If set to true, do no set the "host" tag in the telegraf agent.
  omit_hostname = false

  ## Log level: error, warn, info, debug
  debug = false


###############################################################################
#                            INPUT PLUGINS                                    #
###############################################################################

[[inputs.cpu]]
  ## Whether to report per-cpu stats or only total cpu stats.
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false


[[inputs.disk]]
  ## By default stats will be gathered for all mount points.
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]


[[inputs.net]]
  ## By default, telegraf gathers stats from any up interface (excluding loopback).
  interfaces = ["eth0", "eth1"]
  ignore_protocol_stats = false


[[inputs.kafka_consumer]]
  ## Kafka brokers
  brokers = ["kafka-01.internal:9092", "kafka-02.internal:9092", "kafka-03.internal:9092"]

  ## Topics to consume
  topics = ["app-metrics", "system-events", "user-activity"]

  ## Consumer group
  consumer_group = "telegraf-metrics-consumer"

  ## Offset (oldest/newest)
  offset = "oldest"

  ## Data format to consume
  data_format = "json"

  ## SASL authentication
  sasl_username = "telegraf"
  sasl_password = "supersecretpassword"
  sasl_mechanism = "SCRAM-SHA-256"


###############################################################################
#                            OUTPUT PLUGINS                                   #
###############################################################################

[[outputs.influxdb_v2]]
  ## The URLs of the InfluxDB cluster nodes.
  urls = ["https://influxdb.internal:8086"]

  ## Token for authentication.
  token = "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.secret_token_here"

  ## Organization is the name of the organization you wish to write to.
  organization = "acme-corp"

  ## Destination bucket to write into.
  bucket = "metrics"

  ## TLS settings
  insecure_skip_verify = false


[[outputs.prometheus_client]]
  ## Address to listen on
  listen = ":9273"

  ## Metric version controls the mapping from Telegraf metrics into Prometheus format.
  metric_version = 2

  ## Path to publish metrics on.
  path = "/metrics"

  ## Expiration interval for each metric.
  expiration_interval = "60s"
