# /etc/containers/registries.conf
# Podman / Buildah / CRI-O image registry configuration (v4+ format)
# Reference: https://github.com/containers/image/blob/main/docs/containers-registries.conf.5.md

# Short-name aliasing mode: "enforcing" | "permissive" | "disabled"
short-name-mode = "enforcing"

# Unqualified search registries (used when no registry is specified)
unqualified-search-registries = ["docker.io", "quay.io"]

[[registry]]
prefix = "docker.io"
location = "registry-1.docker.io"
insecure = false
blocked = false

  [[registry.mirror]]
  location = "mirror.example.com"
  insecure = false

  [[registry.mirror]]
  location = "mirror2.example.com"
  insecure = false

[[registry]]
prefix = "quay.io"
location = "quay.io"
insecure = false
blocked = false

[[registry]]
prefix = "gcr.io"
location = "gcr.io"
insecure = false
blocked = false

[[registry]]
prefix = "registry.internal.example.com"
location = "registry.internal.example.com"
insecure = true
blocked = false

[[registry]]
prefix = "untrusted.example.com"
location = "untrusted.example.com"
blocked = true
