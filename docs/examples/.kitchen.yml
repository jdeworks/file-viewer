---
driver:
  name: vagrant
  customize:
    memory: 1024
    cpus: 2

provisioner:
  name: chef_solo
  cookbook_path:
    - cookbooks
    - vendor/cookbooks
  data_bags_path: test/data_bags
  environments_path: test/environments
  require_chef_omnibus: "17"

verifier:
  name: inspec
  reporter:
    - cli
    - junit:test/reports/inspec.xml

transport:
  name: ssh

platforms:
  - name: ubuntu-22.04
    driver_config:
      box: bento/ubuntu-22.04

  - name: centos-stream-9
    driver_config:
      box: bento/centos-stream-9

suites:
  - name: default
    run_list:
      - recipe[myapp::default]
      - recipe[myapp::config]
    attributes:
      myapp:
        version: "2.1.0"
        port: 8080
        debug: false

  - name: hardened
    run_list:
      - recipe[myapp::default]
      - recipe[myapp::harden]
    attributes:
      myapp:
        port: 8443
        tls: true
    excludes:
      - centos-stream-9
