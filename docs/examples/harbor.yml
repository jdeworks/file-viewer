# Harbor container registry configuration
# https://goharbor.io/

hostname: registry.example.com

http:
  port: 80

https:
  port: 443
  certificate: /your/certificate/path
  private_key: /your/private/key/path

# Harbor admin password (set on first launch only)
harbor_admin_password: Harbor12345

# Database settings
database:
  password: root123
  max_idle_conns: 50
  max_open_conns: 1000
  conn_max_lifetime: 5m

# Storage backend settings
storage_service:
  ca_bundle:
  filesystem:
    maxthreads: 100
  redirect:
    disabled: false

# Authentication mode: db_auth, ldap_auth, uaa_auth, oidc_auth
auth_mode: db_auth

# LDAP config (only used when auth_mode is ldap_auth)
ldap:
  url: ldaps://ldap.example.com
  uid: sAMAccountName
  scope: 2
  timeout: 5
  verify_cert: true

# Redis settings
redis:
  host: redis
  port: 6379
  password:
  db: 0
  idle_timeout_seconds: 60

# Core config
core:
  secret: use-a-long-random-secret

# Job service
jobservice:
  max_job_workers: 10
  job_loggers:
    - STD_OUTPUT
    - FILE

# Security
self_registration: off
read_only: false

# Log settings
log:
  level: info
  local:
    rotate_count: 50
    rotate_size: 200m
    location: /var/log/harbor
