# ZooKeeper Configuration File

# Basic settings
tickTime=2000
initLimit=10
syncLimit=5
clientPort=2181

# Data directory
dataDir=/var/lib/zookeeper/data
dataLogDir=/var/lib/zookeeper/log

# Session timeout limits (in milliseconds)
minSessionTimeout=4000
maxSessionTimeout=40000

# Ensemble servers
server.1=zk-1.example.com:2888:3888
server.2=zk-2.example.com:2888:3888
server.3=zk-3.example.com:2888:3888

# Snapshots
autopurge.snapRetainCount=3
autopurge.purgeInterval=1

# Admin server
admin.serverPort=8080
admin.enableServer=true

# TLS/SSL (optional)
secureClientPort=2281
ssl.keyStore.location=/etc/zookeeper/ssl/keystore.jks
ssl.trustStore.location=/etc/zookeeper/ssl/truststore.jks
