# Corosync Cluster Engine Configuration
# Example two-node high-availability cluster

totem {
    version: 2
    cluster_name: ha-cluster
    secauth: on
    transport: knet

    token: 3000
    token_retransmits_before_loss_const: 10
    join: 60
    send_join: 0
    consensus: 3600
    max_messages: 20

    interface {
        ringnumber: 0
        bindnetaddr: 192.168.10.0
        mcastaddr: 239.255.1.1
        mcastport: 5405
        ttl: 1
    }

    interface {
        ringnumber: 1
        bindnetaddr: 10.0.0.0
        mcastaddr: 239.255.1.2
        mcastport: 5407
        ttl: 1
    }
}

nodelist {
    node {
        ring0_addr: 192.168.10.11
        ring1_addr: 10.0.0.11
        nodeid: 1
        name: node1
    }
    node {
        ring0_addr: 192.168.10.12
        ring1_addr: 10.0.0.12
        nodeid: 2
        name: node2
    }
}

quorum {
    provider: corosync_votequorum
    two_node: 1
    wait_for_all: 1
    expected_votes: 2
    votes: 1
}

logging {
    fileline: off
    to_stderr: no
    to_logfile: yes
    logfile: /var/log/corosync/corosync.log
    logfile_priority: info
    to_syslog: yes
    debug: off
    timestamp: on
    logger_subsys {
        subsys: QUORUM
        debug: off
    }
}
