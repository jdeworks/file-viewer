[global]
   workgroup = WORKGROUP
   server string = Samba Server %v
   netbios name = FILESERVER
   security = user
   map to guest = bad user
   dns proxy = no
   interfaces = lo eth0
   bind interfaces only = yes

[homes]
   comment = Home Directories
   browsable = no
   read only = no
   create mask = 0700
   directory mask = 0700
   valid users = %S

[data]
   comment = Shared Data Drive
   path = /srv/samba/data
   browsable = yes
   read only = no
   guest ok = no
   valid users = @samba-users
   write list = @samba-admins
   create mask = 0664
   directory mask = 0775

[public]
   comment = Public Share
   path = /srv/samba/public
   browsable = yes
   guest ok = yes
   read only = yes

[backups]
   comment = Backup Repository
   path = /srv/samba/backups
   valid users = backup-user
   read only = no
   browsable = no
