@version: 3.38
@module system-source

options {
    flush_lines(0);
    time_reopen(10);
    log_fifo_size(10000);
    chain_hostnames(off);
    use_dns(no);
    use_fqdn(no);
    create_dirs(yes);
    keep_hostname(yes);
};

source s_system {
    system();
    internal();
};

source s_network_udp {
    network(
        transport("udp")
        port(514)
        ip("0.0.0.0")
    );
};

destination d_syslog {
    file("/var/log/syslog"
        owner("root") group("adm") perm(0640)
        create_dirs(yes)
    );
};

destination d_remote {
    syslog("logserver.example.com"
        transport("tcp")
        port(6514)
    );
};

destination d_auth {
    file("/var/log/auth.log"
        owner("root") group("adm") perm(0640)
    );
};

filter f_emergency {
    level(emerg);
};

filter f_kernel {
    facility(kern);
};

log {
    source(s_system);
    destination(d_syslog);
};

log {
    source(s_network_udp);
    filter(f_emergency);
    destination(d_remote);
};

log {
    source(s_system);
    filter(f_kernel);
    destination(d_auth);
};
