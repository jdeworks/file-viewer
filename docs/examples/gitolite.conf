# gitolite.conf — Gitolite repository and access control configuration
# See: https://gitolite.com/gitolite/conf.html

@admins     = alice bob
@developers = carol dave eve

repo gitolite-admin
    RW+     = @admins

repo testing
    RW+     = @all

repo myproject
    RW+     = @admins
    RW      = @developers
    R       = @all

repo private/secret
    RW+     = alice
    -       = @all

# Wildcard repos: any user can create their own repos
repo CREATOR/[a-z].+
    C       = @developers
    RW+     = CREATOR
    R       = @all
