title: My Awesome Blog
description: A blog about software and technology
baseurl: ""
url: "https://example.com"
author:
  name: Jane Smith
  email: jane@example.com

theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

markdown: kramdown
highlighter: rouge

permalink: /:year/:month/:day/:title/

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
