# Redis Sentinel configuration
port 26379
daemonize no
loglevel notice
logfile /var/log/redis/sentinel.log
dir /var/lib/redis

bind 0.0.0.0
protected-mode no

# Monitor redis-primary: quorum of 2
sentinel monitor redis-primary 10.0.1.10 6379 2
sentinel down-after-milliseconds redis-primary 30000
sentinel failover-timeout redis-primary 180000
sentinel parallel-syncs redis-primary 1
sentinel auth-pass redis-primary S3cur3P@ssw0rd!

# Monitor redis-cache: quorum of 1
sentinel monitor redis-cache 10.0.2.10 6379 1
sentinel down-after-milliseconds redis-cache 10000
sentinel failover-timeout redis-cache 60000
sentinel parallel-syncs redis-cache 1
sentinel auth-pass redis-cache CachePassw0rd!
sentinel notification-script redis-cache /opt/notify-team.sh

requirepass SentinelMasterPass!
