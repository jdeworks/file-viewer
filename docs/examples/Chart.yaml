apiVersion: v2
name: my-webapp
description: A Helm chart for deploying a simple web application
type: application
version: 0.3.1
appVersion: "1.5.0"
kubeVersion: ">=1.24.0"

dependencies:
  - name: postgresql
    version: "12.x.x"
    repository: https://charts.bitnami.com/bitnami
  - name: redis
    version: "17.x.x"
    repository: https://charts.bitnami.com/bitnami
  - name: ingress-nginx
    version: "4.7.0"
    repository: https://kubernetes.github.io/ingress-nginx
    condition: ingress.enabled
