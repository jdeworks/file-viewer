# Graylog server configuration
# See: https://docs.graylog.org/docs/server-configuration

is_master = true
node_id_file = /etc/graylog/server/node-id

# IMPORTANT: Replace with a 96-character secret for encryption
password_secret = CHANGE_ME_96_CHARACTER_SECRET_STRING_USED_FOR_ENCRYPTION_PURPOSES_MUST_BE_REPLACED_BEFORE_PROD

# SHA-256 hash of the admin password (echo -n "yourpassword" | sha256sum)
root_password_sha2 = 8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918

http_bind_address = 0.0.0.0:9000
http_external_uri = http://graylog.example.com:9000/
http_max_initial_line_length = 8192

rest_listen_uri = http://0.0.0.0:9000/api/

elasticsearch_hosts = http://localhost:9200

mongodb_uri = mongodb://localhost/graylog

rotation_strategy = count
retention_strategy = delete
max_number_of_indices = 20

output_batch_size = 500
processbuffer_processors = 5
