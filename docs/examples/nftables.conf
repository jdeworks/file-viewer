#!/usr/sbin/nft -f

# Flush existing ruleset
flush ruleset

# Define variables
define LAN = 192.168.1.0/24
define TRUSTED_SSH = { 10.0.0.0/8, 192.168.0.0/16 }
define WEBPORTS = { 80, 443 }

table inet filter {
    set blacklist {
        type ipv4_addr
        flags timeout
        elements = { 1.2.3.4 timeout 1h, 5.6.7.8 }
    }

    chain input {
        type filter hook input priority 0; policy drop;

        # Allow established/related connections
        ct state established,related accept
        ct state invalid drop

        # Allow loopback
        iif lo accept

        # ICMP
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # SSH (restricted to trusted networks)
        tcp dport 22 ip saddr $TRUSTED_SSH accept

        # Web traffic
        tcp dport $WEBPORTS accept

        # Drop blacklisted IPs
        ip saddr @blacklist drop

        # Log dropped packets
        log prefix "nftables-drop: " drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
        ct state established,related accept
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}

table ip nat {
    chain prerouting {
        type nat hook prerouting priority -100;
        iif eth0 tcp dport { 80, 443 } dnat to 192.168.1.100
    }

    chain postrouting {
        type nat hook postrouting priority 100;
        oif eth0 masquerade
    }
}
