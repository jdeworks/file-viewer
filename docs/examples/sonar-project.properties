# SonarQube project configuration
sonar.projectKey=com.example:my-app
sonar.projectName=My Application
sonar.projectVersion=2.1.0

# Server
sonar.host.url=https://sonarqube.example.com
sonar.token=squ_abc123xyz456def789

# Source settings
sonar.sources=src/main/java,src/main/resources
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.source=17
sonar.java.target=17

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

# Exclusions
sonar.exclusions=**/generated/**,**/*.min.js,**/vendor/**
sonar.coverage.exclusions=**/test/**,**/*Test.java,**/*Spec.java

# Quality Gate
sonar.qualitygate.wait=true
