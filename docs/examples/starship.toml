# Starship cross-shell prompt configuration
# https://starship.rs/config/

format = """
[╭─](bold green)$os$username$hostname$directory$git_branch$git_status
[╰─](bold green)$nodejs$python$rust$cmd_duration$time$character"""

add_newline = true
command_timeout = 1500
scan_timeout = 30

palette = "monokai"

[palettes.monokai]
color_fg0 = "#f8f8f2"
color_bg1 = "#272822"
color_blue = "#66d9e8"
color_green = "#a6e22e"
color_red = "#f92672"
color_yellow = "#e6db74"
color_orange = "#fd971f"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold blue"
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold purple"
truncation_length = 30
truncation_symbol = "…"

[git_status]
conflicted = "⚡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[nodejs]
symbol = " "
detect_files = ["package.json", ".node-version"]
style = "bold green"

[python]
symbol = " "
python_binary = ["python3", "python"]
detect_extensions = ["py"]
style = "bold yellow"

[rust]
symbol = " "
detect_extensions = ["rs"]
style = "bold red"

[cmd_duration]
min_time = 2000
format = "took [$duration](bold yellow) "

[time]
disabled = false
format = "[$time]($style) "
time_format = "%H:%M"
style = "bold dimmed white"

[username]
show_always = false
style_user = "bold blue"
style_root = "bold red"

[hostname]
ssh_only = true
style = "bold green"

[os]
disabled = false
style = "bold white"
