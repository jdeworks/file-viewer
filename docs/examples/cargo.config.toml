# Cargo configuration file (.cargo/config.toml)
# https://doc.rust-lang.org/cargo/reference/config.html

[build]
target = "x86_64-unknown-linux-gnu"
jobs = 4
rustflags = ["-C", "opt-level=3"]

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[net]
retry = 3
offline = false

[registry]
default = "crates-io"

[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
