/var/log/nginx/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    postrotate
        nginx -s reopen
    endscript
}

/var/log/app/*.log {
    weekly
    rotate 4
    compress
    missingok
    notifempty
    maxsize 100M
}

/var/log/auth.log {
    monthly
    rotate 12
    compress
    missingok
}
