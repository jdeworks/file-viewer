version: 2

global:
  server_name: "matrix.example.com"
  private_key: "/etc/dendrite/matrix_key.pem"
  key_validity_period: 168h0m0s

  well_known_server_name: ""
  well_known_client_name: ""
  well_known_sliding_sync_proxy: ""

  trusted_third_party_id_servers:
    - matrix.org
    - vector.im
    - librepush.net

  disable_federation: false

  presence:
    enable_inbound_presence: false
    enable_outbound_presence: false

  reporting_enabled: false

  database_options:
    connection_string: "file:///var/lib/dendrite/dendrite.db?_busy_timeout=5000&_txlock=immediate"
    max_open_conns: 10
    max_idle_conns: 2
    conn_max_lifetime: -1

  jetstream:
    addresses: []
    topic_prefix: "Dendrite"

  cache:
    max_size_estimated: 1gb
    max_age: 1h

  metrics:
    enabled: true
    basic_auth:
      username: "metrics"
      password: "s3cr3tm3trics"

  dns_cache:
    enabled: false
    cache_size: 256
    cache_lifetime: 5m

  logging:
    - type: std
      level: warn

app_service_api:
  config_files: []

client_api:
  registration_disabled: true
  guests_disabled: true
  registration_shared_secret: "th1s-1s-a-sh4r3d-s3cr3t"
  enable_registration_captcha: false
  recaptcha_public_key: ""
  recaptcha_private_key: ""
  recaptcha_bypass_secret: ""
  recaptcha_siteverify_api: ""
  turn:
    turn_uris: []
    turn_shared_secret: ""
    turn_username: ""
    turn_password: ""

federation_api:
  send_max_retries: 16
  disable_tls_validation: false
  prefer_direct_fetch: false
  key_perspectives:
    - server_name: matrix.org
      keys:
        - key_id: "ed25519:auto"
          public_key: "Noi6WqcDj0QmPxCNQqgezwTlBKrfqehY1u2FyWP9uYw"

federation_sender:
  send_max_retries: 16
  disable_tls_validation: false

key_server: {}

media_api:
  base_path: /var/lib/dendrite/media
  max_file_size_bytes: 10485760
  dynamic_thumbnails: false
  max_thumbnail_generators: 10
  thumbnail_sizes:
    - width: 32
      height: 32
      method: crop
    - width: 96
      height: 96
      method: crop
    - width: 640
      height: 480
      method: scale

mscs:
  mscs: []

room_server: {}

signing_key_server:
  key_perspectives:
    - server_name: matrix.org
      keys:
        - key_id: "ed25519:auto"
          public_key: "Noi6WqcDj0QmPxCNQqgezwTlBKrfqehY1u2FyWP9uYw"

sync_api:
  search:
    enabled: false
    index_path: "/var/lib/dendrite/search"
    language: "en"

user_api:
  bcrypt_cost: 10
  openid_token_lifetime_ms: 3600000
  push_gateway_disable_tls_validation: false
  auto_join_rooms: []

tracing:
  enabled: false
  jaeger:
    serviceName: ""
    disabled: false
