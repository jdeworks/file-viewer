# OpenLDAP slapd configuration

# Schema includes
include         /etc/openldap/schema/core.schema
include         /etc/openldap/schema/cosine.schema
include         /etc/openldap/schema/inetorgperson.schema
include         /etc/openldap/schema/nis.schema

# Global settings
pidfile         /var/run/slapd.pid
argsfile        /var/run/slapd.args
loglevel        256

# TLS configuration
TLSCACertificateFile  /etc/ssl/certs/ca-certificates.crt
TLSCertificateFile    /etc/openldap/certs/slapd.crt
TLSCertificateKeyFile /etc/openldap/certs/slapd.key

# Access control
access to attrs=userPassword
  by self write
  by anonymous auth
  by * none

access to *
  by self write
  by users read
  by * none

# Database configuration
database        mdb
suffix          "dc=example,dc=com"
rootdn          "cn=admin,dc=example,dc=com"
rootpw          secretpassword
directory       /var/lib/openldap/openldap-data

# Database limits
sizelimit       500
timelimit       3600
idletimeout     0

# Indexes
index   objectClass     eq
index   cn,uid          eq,pres,sub
index   uidNumber,gidNumber  eq
index   member,memberUid    eq

# Overlays
overlay memberof
memberof-refint true

overlay refint
refint_attributes member memberof manager owner

overlay unique
unique_uri ldap:///?mail?sub?(objectClass=inetOrgPerson)
