configVersion: 1

shared:
  database:
    type: postgresql
    url: postgresql://artifactory:secret@localhost:5432/artifactory
    driver: org.postgresql.Driver
  security:
    masterKeyFile: /var/opt/jfrog/artifactory/etc/security/master.key
    joinKeyFile: /var/opt/jfrog/artifactory/etc/security/join.key

router:
  port: 8082

artifactory:
  port: 8081
  tomcat:
    connector:
      port: 8081
      sendReasonPhrase: false

access:
  http:
    port: 8040

jfrog:
  home: /var/opt/jfrog/artifactory
