[tox]
minversion = 4.0
envlist =
    py{310,311,312}
    lint
    type
    docs
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = Run the test suite
deps =
    pytest>=7.4
    pytest-cov>=4.1
    pytest-xdist>=3.3
    pytest-asyncio>=0.21
commands =
    pytest {posargs:tests} \
        --cov=src \
        --cov-report=term-missing \
        --cov-report=xml \
        -n auto

[testenv:lint]
description = Run linters
deps =
    ruff>=0.1
    black>=23.0
commands =
    ruff check src tests
    black --check src tests

[testenv:type]
description = Run type checker
deps =
    mypy>=1.5
    types-requests
commands =
    mypy src

[testenv:docs]
description = Build documentation
deps =
    sphinx>=7.0
    sphinx-rtd-theme
commands =
    sphinx-build -b html docs/source docs/build

[testenv:release]
description = Build and upload release
deps =
    build
    twine
commands =
    python -m build
    twine upload dist/*

[pytest]
addopts = -ra -q --strict-markers
testpaths = tests
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    unit: marks tests as unit tests
asyncio_mode = auto
