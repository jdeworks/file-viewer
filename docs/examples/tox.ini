[tox]
envlist = py39,py310,py311,py312,lint,type
isolated_build = True

[testenv]
deps =
    pytest>=8.0
    pytest-cov>=4.0
    requests>=2.31
commands =
    pytest {posargs:tests} --cov=mypackage --cov-report=xml

[testenv:lint]
deps =
    ruff>=0.4
    black>=24.0
commands =
    ruff check src tests
    black --check src tests

[testenv:type]
deps =
    mypy>=1.10
    types-requests
commands =
    mypy src

[coverage:run]
source = mypackage
omit = tests/*

[coverage:report]
fail_under = 80
