# /etc/resolv.conf — DNS resolver configuration
# Generated by NetworkManager

# Primary DNS servers
nameserver 8.8.8.8
nameserver 8.8.4.4
nameserver 1.1.1.1

# Local domain for short-name resolution
domain example.internal

# Search list: try these suffixes when resolving bare hostnames
search example.internal corp.example.com

# Resolver options
options ndots:5
options timeout:2
options attempts:3
