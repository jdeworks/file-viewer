# Squid proxy configuration
# Generated for example.com environment

http_port 3128
https_port 3129 cert=/etc/squid/ssl/squid.pem key=/etc/squid/ssl/squid.key

visible_hostname proxy.example.com

# Network ACLs
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl localnet src fe80::/10

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 21
acl Safe_ports port 443
acl Safe_ports port 70
acl Safe_ports port 210
acl Safe_ports port 1025-65535

acl CONNECT method CONNECT

acl blocked_sites dstdomain .gambling.com .adult-content.org
acl office_hours time MTWHF 08:00-18:00

# Access control
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost manager
http_access deny manager
http_access deny blocked_sites
http_access allow localnet office_hours
http_access allow localhost
http_access deny all

# Cache directory
cache_dir ufs /var/spool/squid 10000 16 256

# Cache memory
cache_mem 256 MB

# Object size limits
maximum_object_size 20 MB
maximum_object_size_in_memory 512 KB

# DNS
dns_nameservers 8.8.8.8 8.8.4.4 1.1.1.1

# Logging
access_log daemon:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
logfile_rotate 7

# Performance
workers 4
pipeline_prefetch 1
