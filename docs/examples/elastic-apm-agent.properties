# Elastic APM Java Agent configuration
# https://www.elastic.co/guide/en/apm/agent/java/current/configuration.html

service_name=payment-service
service_version=2.4.1
environment=production

server_urls=https://apm.example.com:8200,https://apm-backup.example.com:8200
secret_token=supersecrettoken123456789abcdefghijklmnopq

log_level=INFO
transaction_sample_rate=0.25
capture_body=errors
enable_log_correlation=true

cloud_provider=aws
span_frames_min_duration=5ms

# Ignore specific URL patterns
transaction_ignore_urls=/health,/ready,/metrics

# JMX metrics
capture_jmx_statistics=true
