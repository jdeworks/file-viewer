version: "2"

plugins:
  eslint:
    enabled: true
    config:
      config: .eslintrc.json
  duplication:
    enabled: true
    config:
      languages:
        javascript:
          mass_threshold: 40
        typescript:
          mass_threshold: 40
  fixme:
    enabled: true
  markdownlint:
    enabled: true
  stylelint:
    enabled: true
  sonar-js:
    enabled: false

exclude_patterns:
  - "node_modules/"
  - "dist/"
  - "build/"
  - "coverage/"
  - "**/*.min.js"
  - "**/*.bundle.js"
  - "docs/vendor/"
  - "tests/fixtures/"
  - ".cache/"

checks:
  argument-count:
    enabled: true
    config:
      threshold: 4
  complex-logic:
    enabled: true
    config:
      threshold: 4
  file-lines:
    enabled: true
    config:
      threshold: 500
  method-complexity:
    enabled: true
    config:
      threshold: 5
  method-count:
    enabled: true
    config:
      threshold: 20
  method-lines:
    enabled: true
    config:
      threshold: 25
  nested-control-flow:
    enabled: true
    config:
      threshold: 4
  return-statements:
    enabled: true
    config:
      threshold: 4
  similar-code:
    enabled: true
  identical-code:
    enabled: true

ratings:
  paths:
    - "src/**"
    - "lib/**"
  threshold: C
