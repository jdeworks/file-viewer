runtime: nodejs20
env: standard

instance_class: F2

automatic_scaling:
  min_idle_instances: 1
  max_idle_instances: 3
  min_pending_latency: 30ms
  max_pending_latency: automatic
  target_cpu_utilization: 0.65

env_variables:
  NODE_ENV: production

handlers:
  - url: /static
    static_dir: public

  - url: /.*
    script: auto
    secure: always

network:
  session_affinity: true
