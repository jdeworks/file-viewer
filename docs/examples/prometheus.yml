global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: production
    region: us-east-1

rule_files:
  - /etc/prometheus/rules/*.yml
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: node-exporter
    scrape_interval: 30s
    static_configs:
      - targets:
          - node1.example.com:9100
          - node2.example.com:9100
          - node3.example.com:9100

remote_write:
  - url: https://remote.example.com/write
