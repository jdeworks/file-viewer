run:
  timeout: 5m
  go: "1.21"
  tests: true
  allow-parallel-runners: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - exhaustive
    - godot
  disable:
    - typecheck
  presets:
    - bugs
    - performance

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/myorg
  revive:
    rules:
      - name: exported
        severity: warning
  misspell:
    locale: US

issues:
  exclude-rules:
    - path: "_test\\.go"
      linters:
        - errcheck
        - dupl
  max-issues-per-linter: 50
  max-same-issues: 10

output:
  format: colored-line-number
  print-issued-lines: true
