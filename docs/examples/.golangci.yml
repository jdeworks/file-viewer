run:
  timeout: 5m
  go: "1.22"
  build-tags:
    - integration
  skip-dirs:
    - vendor
    - generated

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - revive
    - gosec
    - exhaustive
    - gocritic
    - dupl
    - misspell
  disable:
    - godox
    - wsl
    - exhaustruct

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/myorg/myapp
  revive:
    rules:
      - name: exported
        severity: warning
  gosec:
    excludes:
      - G104
  gocritic:
    enabled-tags:
      - diagnostic
      - style
    disabled-checks:
      - paramTypeCombine

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - dupl
        - gosec
    - path: cmd/
      linters:
        - exhaustive
  exclude:
    - "Error return value of .* is not checked"
  max-issues-per-linter: 50
  max-same-issues: 10
  new: false
