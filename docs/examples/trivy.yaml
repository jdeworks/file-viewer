scan:
  scanners:
    - vuln
    - config
    - secret
  skip-dirs:
    - node_modules
    - vendor
    - .git
  skip-files:
    - "**/*.test.*"
    - "**/testdata/**"

severity:
  - CRITICAL
  - HIGH

vulnerability:
  type:
    - os
    - library
  ignore-unfixed: true
  ignored-vulnerabilities:
    - CVE-2022-12345
    - CVE-2021-99999
    - CVE-2023-44487

misconfiguration:
  include-non-failures: false

secret:
  config: trivy-secret.yaml

format: table
exit-code: 1
timeout: 5m0s
