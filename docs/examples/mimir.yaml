target: all

server:
  http_listen_port: 8080
  grpc_listen_port: 9095
  log_level: info

common:
  storage:
    backend: s3
    s3:
      bucket_name: mimir-blocks
      endpoint: s3.us-east-1.amazonaws.com
      region: us-east-1
      access_key_id: AKIAIOSFODNN7EXAMPLE
      secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

blocks_storage:
  backend: s3
  s3:
    bucket_name: mimir-blocks
    endpoint: s3.us-east-1.amazonaws.com
    region: us-east-1
    access_key_id: AKIAIOSFODNN7EXAMPLE
    secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
  tsdb:
    dir: /var/mimir/tsdb

distributor:
  ring:
    kvstore:
      store: memberlist
  ha_tracker:
    enable_ha_tracker: true
    kvstore:
      store: etcd
      etcd:
        endpoints:
          - etcd:2379

ingester:
  ring:
    replication_factor: 3
    kvstore:
      store: memberlist
  max_global_series_per_user: 0

store_gateway:
  sharding_enabled: true
  sharding_ring:
    kvstore:
      store: memberlist

compactor:
  working_directory: /var/mimir/compactor
  sharding_ring:
    kvstore:
      store: memberlist

limits:
  ingestion_rate: 10000
  ingestion_burst_size: 200000
  max_global_series_per_user: 1500000
  max_global_series_per_metric: 20000
  max_fetched_chunks_per_query: 2000000
  ruler_max_rules_per_rule_group: 20

ruler_storage:
  backend: s3
  s3:
    bucket_name: mimir-rules
    endpoint: s3.us-east-1.amazonaws.com
    region: us-east-1
    access_key_id: AKIAIOSFODNN7EXAMPLE
    secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

memberlist:
  join_members:
    - mimir-1:7946
    - mimir-2:7946
    - mimir-3:7946
