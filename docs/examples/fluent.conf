# Fluentd main configuration file

<source>
  @type forward
  port 24224
  bind 0.0.0.0
  tag docker
</source>

<source>
  @type tail
  path /var/log/app/*.log
  pos_file /var/log/fluentd/app.log.pos
  tag app.logs
  @id app_tail
  <parse>
    @type json
    time_key timestamp
    time_format %Y-%m-%dT%H:%M:%S.%NZ
  </parse>
</source>

<source>
  @type http
  port 9880
  bind 0.0.0.0
  tag http.events
</source>

<filter app.**>
  @type record_transformer
  <record>
    hostname "#{Socket.gethostname}"
    environment production
    service myapp
  </record>
</filter>

<filter app.**>
  @type grep
  <regexp>
    key level
    pattern /^(warn|error|fatal)$/
  </regexp>
</filter>

<match docker.**>
  @type elasticsearch
  host elasticsearch.example.com
  port 9200
  logstash_format true
  logstash_prefix docker
  include_tag_key true
  tag_key @log_name
  flush_interval 5s
</match>

<match app.**>
  @type copy
  <store>
    @type elasticsearch
    host elasticsearch.example.com
    port 9200
    logstash_format true
    logstash_prefix app
    flush_interval 10s
  </store>
  <store>
    @type stdout
  </store>
</match>

<match **>
  @type file
  path /var/log/fluentd/unmatched
  compress gzip
  <buffer time>
    timekey 1d
    timekey_wait 10m
    timekey_use_utc true
  </buffer>
</match>
