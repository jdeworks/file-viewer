apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: my-app-secrets
  namespace: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: my-app-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DATABASE_URL: "{{ .db_url }}"
        API_KEY: "{{ .api_key }}"
  data:
    - secretKey: db_url
      remoteRef:
        key: prod/my-app/database
        property: url
    - secretKey: api_key
      remoteRef:
        key: prod/my-app/credentials
        property: api_key
  dataFrom:
    - extract:
        key: prod/my-app/config
