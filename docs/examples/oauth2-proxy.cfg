## oauth2-proxy configuration example

provider = "github"
client_id = "EXAMPLE_GITHUB_CLIENT_ID"
client_secret = "EXAMPLE_SECRET_DO_NOT_USE"

## Upstream application
upstream = "http://localhost:3000/"

## Server address
http_address = "0.0.0.0:4180"
redirect_url = "https://app.example.com/oauth2/callback"

## Cookie settings
cookie_secret = "EXAMPLE_COOKIE_SECRET_DO_NOT_USE_32B"
cookie_domain = ".example.com"
cookie_name = "_oauth2_proxy"
cookie_secure = "true"
cookie_expire = "168h0m0s"

## Authorization — restrict by email domain
email_domains = "example.com"
email_domains = "example.org"

## Skip auth for health endpoint
skip_auth_routes = "^/healthz$"
skip_auth_routes = "^/metrics$"
