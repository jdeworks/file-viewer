# GnuPG configuration file
# ~/.gnupg/gpg.conf

# Use the default key for signing
default-key 0xABCDEF0123456789

# Default recipient is self when encrypting
default-recipient-self

# Use GPG agent for passphrase caching
use-agent

# Key server
keyserver hkps://keys.openpgp.org
keyserver-options auto-key-retrieve
keyserver-options no-honor-keyserver-url

# Algorithm preferences (strong modern algorithms)
personal-cipher-preferences AES256 AES192 AES
personal-digest-preferences SHA512 SHA384 SHA256
personal-compress-preferences ZLIB BZIP2 ZIP Uncompressed
default-preference-list SHA512 SHA384 SHA256 AES256 AES192 AES ZLIB BZIP2 ZIP Uncompressed

# Cryptography
cert-digest-algo SHA512
digest-algo SHA512
cipher-algo AES256

# Key ID display format
keyid-format 0xlong
with-fingerprint

# Output preferences
armor
no-emit-version
no-comments
fixed-list-mode

# Cross-certification verification (security)
require-cross-certification
no-auto-check-trustdb
